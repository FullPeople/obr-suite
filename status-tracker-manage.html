<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>buff 管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:var(--suite-bg,#292d3c);
  --bg-card:var(--suite-bg-card,#323748);
  --bg-strong:var(--suite-bg-strong,#1f2230);
  --border:var(--suite-border,rgba(255,255,255,0.24));
  --border-strong:var(--suite-border-strong,rgba(255,255,255,0.36));
  --text:var(--suite-text,#e6e8ee);
  --text-dim:var(--suite-text-dim,#aab0c2);
  --text-mute:var(--text-dim);
  --accent:var(--suite-accent,#5dade2);
  --accent-dim:var(--accent);
  --warn:var(--suite-warn,#f5a623);
  --red:var(--danger);
  --green:var(--success);
}

html,body{
  height:100%;width:100%;overflow:hidden;background:transparent;
  color:var(--text);
  font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji","Twemoji Mozilla","EmojiOne Color",
    -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;
  user-select:none;
}

.card{
  position:absolute;inset:0;
  background:var(--bg);
  border:1px solid var(--border-strong);
  border-radius:10px;
  display:flex;flex-direction:column;
  box-shadow:0 8px 24px var(--shadow);
  overflow:hidden;
}

.head{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px 6px 10px;
  background:var(--bg-card);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.head .ttl{
  flex:1;font-size:12px;font-weight:700;color:var(--accent-dim);
  letter-spacing:0.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.head .x{
  background:transparent;border:1px solid var(--border);
  color:var(--text-dim);
  cursor:pointer;font-family:inherit;
  width:22px;height:22px;padding:0;border-radius:4px;
  font-size:13px;font-weight:600;
}
.head .x:hover{color:var(--text);border-color:var(--border-strong)}

.body{
  flex:1;overflow-y:auto;
  padding:8px 10px;
  display:flex;flex-wrap:wrap;gap:5px;
  align-content:flex-start;
}
.body::-webkit-scrollbar{width:5px}
.body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

.bubble{
  display:inline-flex;align-items:center;
  height:23px;padding:0 8px;border-radius:5px;
  font-size:11px;font-weight:700;
  border:1px solid rgba(0,0,0,0.50);
  white-space:nowrap;
  cursor:grab;
  box-shadow:0 1px 2px var(--shadow);
  user-select:none;
}
.bubble:hover{filter:brightness(1.10)}
.bubble:active{cursor:grabbing}

.empty{
  width:100%;
  text-align:center;
  font-size:11px;
  color:var(--text-mute);
  font-style:italic;
  padding:12px 0;
}

.foot{
  padding:6px 10px;
  border-top:1px solid var(--border);
  font-size:9.5px;color:var(--text-mute);
  flex-shrink:0;
  line-height:1.5;
  text-align:center;
}
.foot b{color:var(--text-dim)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head">
    <span class="ttl" id="title" data-i18n="stManageTitle">buff 管理</span>
    <button class="x" id="btnClose" type="button" data-i18n-title="stClosePlain" title="关闭"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="body" id="grid"></div>
  <div class="foot" data-i18n-html="stManageFootHint">
    拖到 <b>其他角色</b> = 转移 · 拖到 <b>外面</b> = 取消
  </div>
</div>
<script type="module" src="/src/status-tracker-manage-page.ts"></script>
</body>
</html>
