<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>圆形图片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:var(--suite-bg,#292d3c);--bg-strong:var(--suite-bg-strong,#1f2230);--bg-card:var(--suite-bg-card,#323748);
  --border:var(--suite-border,rgba(255,255,255,0.24));--border-strong:var(--suite-border-strong,rgba(255,255,255,0.36));
  --text:var(--suite-text,#e6e8ee);--text-dim:var(--suite-text-dim,#aab0c2);
  --accent:var(--suite-accent,#5dade2);--accent-warm:var(--warn);--accent-red:var(--danger);--accent-green:var(--success);
}
html,body{
  height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  color:var(--text);background:transparent;
  pointer-events:none;
  font-size:13px;
}
.card{
  position:absolute;inset:0;
  background:var(--bg);
  border:1px solid var(--border-strong);
  border-radius:10px;
  box-shadow:0 12px 36px var(--shadow);
  pointer-events:auto;
  display:flex;flex-direction:column;
  padding:14px 16px;
  overflow:hidden;
}
.hdr{
  display:flex;align-items:center;gap:8px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
  margin-bottom:12px;flex-shrink:0;
}
.hdr .ic{font-size:14px;color:var(--accent)}
.hdr .ttl{font-size:14px;font-weight:700;flex:1;letter-spacing:0.2px}
.hdr .x{
  cursor:pointer;font-size:18px;color:var(--text-dim);line-height:1;padding:0 4px;
  background:none;border:none;transition:color .12s;
}
.hdr .x:hover{color:var(--text)}

.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}

/* ---- drop zone (shown when no image loaded) ---- */
#drop-zone{
  flex:1;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;
  background:var(--bg-strong);
  border:2px dashed var(--border-strong);
  border-radius:8px;
  cursor:pointer;
  transition:border-color .12s, background .12s;
}
#drop-zone:hover, #drop-zone.dragover{
  border-color:var(--accent);
  background:var(--accent-soft);
}
#drop-zone .big{font-size:30px;color:var(--text-dim);line-height:1}
#drop-zone .lbl{font-size:13px;color:var(--text);text-align:center;max-width:100%;padding:0 8px}
#drop-zone .sub{font-size:11px;color:var(--text-dim);text-align:center;max-width:100%;padding:0 8px}
#file-input{display:none}

/* ---- editor (shown after an image is loaded) ---- */
#editor{flex:1;min-height:0;display:none;flex-direction:column;gap:10px}
#editor.active{display:flex}

#canvas-wrap{
  flex:1;min-height:0;
  position:relative;
  background:var(--bg-strong);
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
}
#canvas{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
  cursor:move;
  touch-action:none;
}

.ctrl-row{
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.ctrl-row .lbl{
  font-size:10.5px;color:var(--text-dim);
  font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  flex-shrink:0;width:82px;
}
.ctrl-row input[type=range]{
  flex:1;min-width:0;height:24px;
  accent-color:var(--accent);
}
.ctrl-row input[type=color]{
  width:38px;height:28px;
  background:var(--bg-strong);
  border:1px solid var(--border);
  border-radius:4px;
  cursor:pointer;padding:2px;
}
.ctrl-row .val{
  font-size:11px;color:var(--text-dim);
  min-width:34px;text-align:right;
  font-variant-numeric:tabular-nums;
}

.btn-row{
  margin-top:auto;display:flex;gap:6px;justify-content:flex-end;
  align-items:center;
  padding-top:12px;
  border-top:1px solid var(--border);flex-shrink:0;
}
.btn{
  height:30px;padding:0 14px;border-radius:6px;
  background:var(--bg-card);color:var(--text);
  border:1px solid var(--border);font-size:12px;cursor:pointer;
  font-family:inherit;font-weight:600;
  transition:background .12s, border-color .12s, color .12s;
  user-select:none;
}
.btn:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#4a99ce;border-color:#4a99ce}
.btn.warm:hover{background:var(--warn-soft);border-color:var(--warn-line);color:#ffba5d}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger)}

/* "添加到资源库" call-to-action — green so users see it as the
   "commit" action even though it's now a regular click button. */
.btn.drag-handle{
  min-width:0;flex:1;height:40px;white-space:normal;padding:5px 9px;
  background:var(--success-soft);
  border:1px solid var(--success-line);
  color:#7eecaf;
}
.btn.drag-handle:hover{
  background:var(--success-soft);
  border-color:var(--success-line);
  color:#a4f5c8;
}
.btn.drag-handle.uploading{
  background:var(--tint);
  border-color:var(--text-dim);
  color:var(--text-dim);
  cursor:wait;
}
.btn.drag-handle.ok{
  background:var(--success-line);
  border-color:var(--success-line);
  color:#fff;
}

/* ---- mode tabs ---- */
.tab-strip{
  display:flex;gap:4px;flex-shrink:0;
  margin-bottom:8px;
}
.tab-strip .tab{
  flex:1;height:30px;
  background:var(--bg-strong);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text-dim);
  font-family:inherit;font-size:12px;font-weight:600;
  cursor:pointer;
  transition:background .12s, border-color .12s, color .12s;
  user-select:none;
}
.tab-strip .tab:hover{
  color:var(--text);
  background:var(--bg-card);
}
.tab-strip .tab.on{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

/* per-mode control panel — show only the panel matching the active mode */
.ctrls{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.ctrls[hidden]{display:none}

/* checkered transparency background under the canvas — only useful
   in bgremove mode where the user needs to see what's been made
   transparent. Toggled via a body-level data-mode attribute below. */
#canvas-wrap{
  background-image:
    linear-gradient(45deg, var(--tint) 25%, transparent 25%),
    linear-gradient(-45deg, var(--tint) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--tint) 75%),
    linear-gradient(-45deg, transparent 75%, var(--tint) 75%);
  background-size:14px 14px;
  background-position:0 0, 0 7px, 7px -7px, -7px 0;
}

/* bg-remove "white / black" segmented toggle */
.bg-toggle{
  height:26px;padding:0 12px;border-radius:5px;
  background:var(--bg-strong);
  border:1px solid var(--border);
  color:var(--text-dim);font-size:12px;font-family:inherit;
  cursor:pointer;flex:1;
  transition:background .12s, color .12s, border-color .12s;
  user-select:none;font-weight:600;
}
.bg-toggle.on{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
</style>
</head>
<body>
<div class="card">
  <div class="hdr">
    <span class="ic">⊙</span>
    <span class="ttl" data-image-text="title">图片处理</span>
    <button class="x" id="btnClose" type="button" data-image-title="close" data-image-aria="close"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="body">
    <!-- Mode tabs — switch between circle-crop and background-removal -->
    <div class="tab-strip">
      <button class="tab on" data-mode="circle" type="button" data-image-text="circle">圆形裁剪</button>
      <button class="tab" data-mode="bgremove" type="button" data-image-text="bgremove">白底黑底剔除</button>
    </div>

    <!-- Drop zone (initial empty state — shown for both modes) -->
    <div id="drop-zone" tabindex="0">
      <div class="big">＋</div>
      <div class="lbl" data-image-text="drop">拖入图片 / 点击选择 / Ctrl+V 粘贴</div>
      <div class="sub" data-image-text="formats">支持 JPG / PNG / WebP / SVG，最大 10 MB</div>
      <input type="file" id="file-input" accept="image/*" />
    </div>

    <!-- Editor (post-load) -->
    <div id="editor">
      <div id="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>

      <!-- Circle-crop controls -->
      <div class="ctrls" id="ctrls-circle">
        <div class="ctrl-row">
          <span class="lbl" data-image-text="size">大小</span>
          <input type="range" id="size-slider" min="40" max="600" value="300" data-image-aria="size" />
          <span class="val" id="size-val">300</span>
        </div>
        <div class="ctrl-row">
          <span class="lbl" data-image-text="zoom">缩放</span>
          <input type="range" id="zoom-slider" min="20" max="400" value="100" data-image-aria="zoom" />
          <span class="val" id="zoom-val">100%</span>
        </div>
        <div class="ctrl-row">
          <span class="lbl" data-image-text="ring">环颜色</span>
          <input type="color" id="ring-color" value="#f5a623" data-image-aria="ringColor" />
          <input type="range" id="ring-width" min="0" max="40" value="0" style="flex:1" data-image-aria="ringWidth" />
          <span class="val" id="ring-val">0</span>
        </div>
      </div>

      <!-- Background-removal controls -->
      <div class="ctrls" id="ctrls-bgremove" hidden>
        <div class="ctrl-row" style="gap:6px">
          <span class="lbl" data-image-text="background">背景</span>
          <button class="bg-toggle on" data-kind="white" type="button" data-image-text="white">剔除白底</button>
          <button class="bg-toggle" data-kind="black" type="button" data-image-text="black">剔除黑底</button>
        </div>
        <div class="ctrl-row">
          <span class="lbl" data-image-text="tolerance">容差</span>
          <input type="range" id="bg-tolerance" min="0" max="120" value="40" data-image-aria="tolerance" />
          <span class="val" id="bg-tolerance-val">40</span>
        </div>
        <div class="ctrl-row">
          <span class="lbl" data-image-text="feather">羽化</span>
          <input type="range" id="bg-feather" min="0" max="40" value="8" data-image-aria="feather" />
          <span class="val" id="bg-feather-val">8</span>
        </div>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn danger" id="btnReset" type="button" data-image-text="replace">换图</button>
    <button class="btn drag-handle" id="btnDrag" type="button" data-image-title="uploadHelp" title="把当前裁剪结果上传到 OBR 资源库；之后可从资源库拖到场景使用">⤴ 添加到资源库</button>
  </div>
</div>
<script type="module" src="/src/modules/circleImage/popover-page.ts"></script>
</body>
</html>
