<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Dice Menu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:var(--suite-bg,#292d3c);
  --border:var(--suite-border,rgba(255,255,255,0.24));
  --text:var(--suite-text,#e6e8ee);--text-dim:var(--suite-text-dim,#aab0c2);
  --accent:var(--suite-accent,#5dade2);--green:var(--success);--red:var(--danger);--yellow:var(--warn);
  --purple:#bb87dd;
}
html,body{
  height:100%;width:100%;overflow:hidden;background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  color:var(--text);font-size:12px;
}
.menu{
  position:absolute;inset:0;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:8px;
  padding:4px;
  box-shadow:0 6px 22px var(--shadow);
  user-select:none;
  -webkit-user-select:none;
}
.item{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:5px;cursor:pointer;
  white-space:nowrap;
  transition:background .12s;
  font-family:inherit;color:inherit;font-size:12px;
  background:transparent;border:none;
  width:100%;text-align:left;
}
.item:hover{background:var(--accent-soft)}
.item .ico{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;font-size:13px;font-weight:700;color:var(--accent);
  flex-shrink:0;
}
.item.adv .ico{color:var(--green)}
.item.dis .ico{color:var(--red)}
.item.tray .ico{color:var(--yellow)}
.item.dark .ico{color:var(--purple)}
.item.crit .ico{color:#ffb74d}
.sep{height:1px;background:var(--border);margin:3px 4px}
</style>
</head>
<body>
<div class="menu">
  <button class="item" data-act="roll"><span class="ico"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M16 8h.01"/><path d="M16 12h.01"/><path d="M16 16h.01"/><path d="M8 8h.01"/><path d="M8 12h.01"/><path d="M8 16h.01"/></svg></span><span data-l="roll">投掷</span></button>
  <button class="item dark" data-act="dark"><span class="ico"><svg class="ui-ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.18em" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="currentColor" stroke="none"/></svg></span><span data-l="dark">暗骰</span></button>
  <button class="item adv" data-act="adv"><span class="ico"><svg class="ui-ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.18em" aria-hidden="true"><path d="M12 5 L20 18 H4 Z" fill="currentColor" stroke="none"/></svg></span><span data-l="adv">优势</span></button>
  <button class="item dis" data-act="dis"><span class="ico"><svg class="ui-ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.18em" aria-hidden="true"><path d="M12 19 L4 6 H20 Z" fill="currentColor" stroke="none"/></svg></span><span data-l="dis">劣势</span></button>
  <button class="item crit" data-act="crit"><span class="ico"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/></svg></span><span data-l="crit">重击</span></button>
  <div class="sep"></div>
  <button class="item tray" data-act="tray"><span class="ico"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span><span data-l="tray">添加到骰盘</span></button>
</div>
<script type="module">
import OBR from "@owlbear-rodeo/sdk";

const POPOVER_ID = "com.obr-suite/rollable-menu";
const BC_QUICK_ROLL = "com.obr-suite/dice-quick-roll";
const BC_PANEL_TOGGLE = "com.obr-suite/dice-panel-toggle";
// Group-save mode (used by bestiary-group-saves popover). When the
// menu is opened with `?groupSave=1&ability=<key>`, clicks broadcast
// to BC_GROUP_SAVE_FIRE instead of BC_QUICK_ROLL — the bestiary group-
// saves bg module receives the broadcast and fires per-token rolls
// with each monster's own save bonus.
const BC_GROUP_SAVE_FIRE = "com.obr-suite/bestiary-group-save-fire";

// Per-client UI language (mirrors src/state.ts LS_LANG).
const LANG = (() => {
  try { const v = localStorage.getItem("obr-suite/lang"); if (v === "en" || v === "zh") return v; } catch {}
  return "zh";
})();
const L = {
  zh: { roll: "投掷", dark: "暗骰", adv: "优势", dis: "劣势", crit: "重击", tray: "添加到骰盘" },
  en: { roll: "Roll", dark: "Dark Roll", adv: "Advantage", dis: "Disadvantage", crit: "Critical", tray: "Add to Tray" },
}[LANG];
document.querySelectorAll("[data-l]").forEach((el) => { el.textContent = L[el.dataset.l] ?? el.textContent; });
document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";

const params = new URLSearchParams(location.search);
const expression = params.get("expr") ?? "";
const label = params.get("label") ?? "";
const itemId = params.get("itemId") || null;

// "Group save" mode — drop the add-to-tray item (each token has its
// own per-bonus expression so a single tray entry can't represent the
// group). The remaining 4 items broadcast to BC_GROUP_SAVE_FIRE.
const groupSave = params.get("groupSave") === "1";
const groupAbility = params.get("ability") ?? "";
if (groupSave) {
  const tray = document.querySelector(".item.tray");
  const sep = document.querySelector(".sep");
  if (tray) tray.remove();
  if (sep) sep.remove();
}

async function close() {
  try { await OBR.popover.close(POPOVER_ID); } catch {}
}

OBR.onReady(() => {
  document.querySelectorAll(".item").forEach((el) => {
    el.addEventListener("click", async () => {
      const act = el.dataset.act ?? "";
      try {
        if (groupSave && groupAbility) {
          // Group-save dispatch — BG module owns the per-token bonus
          // resolution + collectiveId grouping. Tray is hidden in this
          // mode, so we never see act === "tray" here.
          if (act === "roll") {
            await OBR.broadcast.sendMessage(
              BC_GROUP_SAVE_FIRE,
              { ability: groupAbility, hidden: false },
              { destination: "LOCAL" },
            );
          } else if (act === "dark") {
            await OBR.broadcast.sendMessage(
              BC_GROUP_SAVE_FIRE,
              { ability: groupAbility, hidden: true },
              { destination: "LOCAL" },
            );
          } else if (act === "adv" || act === "dis") {
            await OBR.broadcast.sendMessage(
              BC_GROUP_SAVE_FIRE,
              { ability: groupAbility, advMode: act },
              { destination: "LOCAL" },
            );
          } else if (act === "crit") {
            await OBR.broadcast.sendMessage(
              BC_GROUP_SAVE_FIRE,
              { ability: groupAbility, critMode: true },
              { destination: "LOCAL" },
            );
          }
        } else if (act === "tray") {
          // Forward the rollable's label too — the dice panel will
          // pre-fill the 备注 field with the skill / save name so a
          // subsequent roll's history line shows context.
          await OBR.broadcast.sendMessage(
            BC_PANEL_TOGGLE,
            { open: true, prefill: expression, prefillLabel: label },
            { destination: "LOCAL" },
          );
        } else if (act === "roll") {
          await OBR.broadcast.sendMessage(
            BC_QUICK_ROLL,
            { expression, label, itemId, focus: !!itemId, hidden: false },
            { destination: "LOCAL" },
          );
        } else if (act === "dark") {
          await OBR.broadcast.sendMessage(
            BC_QUICK_ROLL,
            { expression, label, itemId, focus: !!itemId, hidden: true },
            { destination: "LOCAL" },
          );
        } else if (act === "adv" || act === "dis") {
          await OBR.broadcast.sendMessage(
            BC_QUICK_ROLL,
            { expression, label, itemId, focus: !!itemId, hidden: false, advMode: act },
            { destination: "LOCAL" },
          );
        } else if (act === "crit") {
          // 重击 — double every NdM term in the expression while
          // leaving the modifier unchanged. Handled BG-side (see
          // QuickRollRequest.critMode in src/modules/dice/index.ts).
          await OBR.broadcast.sendMessage(
            BC_QUICK_ROLL,
            { expression, label, itemId, focus: !!itemId, hidden: false, critMode: true },
            { destination: "LOCAL" },
          );
        }
      } catch (e) { console.error("[rollable-menu]", e); }
      await close();
    });
  });

  // Auto-close if user presses Esc.
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      e.preventDefault();
      void close();
    }
  });
});
</script>
</body>
</html>
