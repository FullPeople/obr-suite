<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>编辑资源</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:var(--suite-bg,#292d3c);--bg-strong:var(--suite-bg-strong,#1f2230);--bg-card:var(--suite-bg-card,#323748);--bg-elev:#2e3346;
  --border:var(--suite-border,rgba(255,255,255,0.24));--border-strong:var(--suite-border-strong,rgba(255,255,255,0.36));
  --text:var(--suite-text,#e6e8ee);--text-dim:var(--suite-text-dim,#aab0c2);--text-mute:var(--text-dim);
  --accent:var(--suite-accent,#5dade2);--accent-warm:var(--warn);--accent-red:var(--danger);--accent-green:var(--success);
}
html,body{
  height:100%;width:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  color:var(--text);background:var(--bg-strong);
  font-size:13px;
  display:flex;align-items:center;justify-content:center;
}

/* ===== modal card — modern square design (zero rounded corners) ===== */
.card{
  width:min(440px, 92vw);
  max-height:90vh;
  background:var(--bg);
  border:1px solid var(--border-strong);
  border-radius:var(--radius);
  box-shadow:0 14px 40px var(--shadow);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.hdr{
  display:flex;align-items:center;gap:8px;
  padding:12px 16px;
  background:var(--bg-strong);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.hdr .ttl{font-size:14px;font-weight:700;letter-spacing:0.3px}
.hdr .x{
  cursor:pointer;font-size:18px;color:var(--text-dim);line-height:1;
  width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid transparent;border-radius:var(--radius);
  font-family:inherit;
  transition:color .12s, background .12s, border-color .12s;
}
.hdr .x:hover{color:var(--danger);background:var(--danger-soft);border-color:var(--danger)}
.hdr>.ui-ico{--icon:18px;color:var(--accent);flex:none}
.hdr .ttl-wrap{flex:1;min-width:0}
.hdr .sub{font-size:11px;color:var(--text-dim);margin-top:1px;line-height:1.4}

.body{
  flex:1;min-height:0;overflow-y:auto;
  padding:14px 16px;
  display:flex;flex-direction:column;gap:11px;
}
.body::-webkit-scrollbar{width:6px}
.body::-webkit-scrollbar-thumb{background:var(--border)}

/* labelled fields */
label.field, .field{
  display:flex;flex-direction:column;gap:4px;
}
.field > span:first-child, .lbl{
  font-size:10.5px;color:var(--text-dim);text-transform:uppercase;
  letter-spacing:.5px;font-weight:700;
}
.field input[type=text],
.field input[type=number],
.field select{
  width:100%;min-width:0;
  height:32px;padding:0 10px;
  background:var(--bg-strong);
  border:1px solid var(--border-strong);
  border-radius:var(--radius);
  color:var(--text);font-size:13px;outline:none;
  font-family:inherit;
  transition:border-color .12s, background .12s;
}
.field input:focus,.field select:focus{
  border-color:var(--accent);
  background:var(--bg-strong);
}
.row-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

/* ===== type toggle (个数 / 进度 / 数字) ===== */
.type-toggle{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  height:32px;
  background:var(--bg-strong);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.type-toggle button{
  background:transparent;border:none;
  color:var(--text-dim);
  font-family:inherit;font-size:12px;font-weight:700;
  cursor:pointer;letter-spacing:0.4px;
  transition:background .12s, color .12s;
}
.type-toggle button:hover{color:var(--text);background:var(--tint)}
.type-toggle button.on{
  background:var(--accent-soft);
  color:var(--accent);
  box-shadow:inset 0 -2px 0 0 var(--accent);
}
.type-toggle button + button{border-left:1px solid var(--border)}

/* ===== icon grid — seamless square highlights, no gap, no per-cell radius =====
   gap:0 + the host-grid border + each cell's right/bottom border draws a
   uniform 1px lattice. The selection is a solid accent fill that snaps
   exactly to the cell box — gapless, square, "modern". */
.icon-grid{
  display:grid;grid-template-columns:repeat(8, 1fr);gap:0;
  max-height:208px;overflow-y:auto;
  background:var(--bg-strong);
  border:1px solid var(--border);
  border-radius:var(--radius);
}
.icon-grid::-webkit-scrollbar{width:6px}
.icon-grid::-webkit-scrollbar-thumb{background:var(--border)}
.icon-pick{
  height:38px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  background:transparent;
  border:0;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text-dim);
  transition:background .08s, color .08s;
}
.icon-pick:hover{background:var(--tint);color:var(--text)}
.icon-pick.on{
  background:var(--accent);
  color:#0b1320;
  /* knock out the lattice line under the active cell so it reads as a
     single seamless tile (the next-row cell's top border doesn't exist;
     this cell's bottom border vanishes too). */
  border-right-color:var(--accent);
  border-bottom-color:var(--accent);
}
.icon-pick svg{width:22px;height:22px;pointer-events:none}

/* ===== presets — chip strip, mirrors portal's "名字预设" pattern ===== */
.presets-wrap{display:flex;flex-direction:column;gap:5px}
.presets-wrap .lbl-row{
  display:flex;align-items:center;justify-content:space-between;
  font-size:10.5px;color:var(--text-dim);letter-spacing:.5px;
  font-weight:700;text-transform:uppercase;
}
.presets-wrap .add{
  font-size:10.5px;color:var(--accent);cursor:pointer;
  background:transparent;border:1px solid transparent;
  padding:2px 8px;border-radius:var(--radius);
  font-family:inherit;font-weight:700;
  transition:background .12s, color .12s, border-color .12s;
}
.presets-wrap .add:hover{
  background:var(--accent-soft);color:var(--accent);
  border-color:var(--accent-line);
}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:24px}
.chips .empty{font-size:10.5px;color:var(--text-mute);padding:3px 0}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 6px 4px 10px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  font-size:11px;color:var(--text);
  cursor:pointer;user-select:none;
  transition:background .12s, border-color .12s, color .12s;
}
.chip:hover{
  background:var(--accent-soft);
  border-color:var(--accent-line);
  color:var(--text);
}
.chip .ico{
  width:13px;height:13px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--text-dim);
}
.chip .ico svg{width:13px;height:13px}
.chip:hover .ico{color:var(--accent-dim)}
.chip .del{
  font-size:11px;color:var(--text-mute);line-height:1;
  margin-left:2px;
  background:transparent;border:1px solid transparent;cursor:pointer;
  padding:1px 5px;border-radius:var(--radius);
  font-family:inherit;
  transition:color .12s, background .12s, border-color .12s;
}
.chip .del:hover{color:#fff;background:var(--accent-red);border-color:var(--accent-red)}

/* ===== preview row ===== */
.preview-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;
  background:var(--bg-strong);
  border:1px solid var(--border);
  border-radius:var(--radius);
}
.preview-icon{
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  color:var(--accent-dim);
}
.preview-icon svg{width:26px;height:26px}
.preview-label{flex:1;font-size:11px;color:var(--text-dim)}

/* ===== bottom action row ===== */
.btn-row{
  display:flex;gap:6px;
  padding:12px 16px;
  background:var(--bg-strong);
  border-top:1px solid var(--border);
  flex-shrink:0;
  align-items:center;
}
.btn{padding:0 14px;letter-spacing:0.3px}
</style>
</head>
<body>
<div class="card">
  <div class="hdr">
    <svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
    <div class="ttl-wrap"><div class="ttl" id="title" data-i18n="reEditTitle">编辑资源</div><div class="sub" data-i18n="reEditSub">名字、类型和上限保存到这个令牌；预设可以在其他角色上复用。</div></div>
    <button class="x" id="btnX" type="button" title="关闭" data-i18n-title="reClose"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="body">
    <label class="field">
      <span data-i18n="reLblName">名字</span>
      <input type="text" id="name" maxlength="32" placeholder="如：一环法术槽 / 灵感" data-i18n-placeholder="reNamePh" />
    </label>

    <div class="field">
      <span data-i18n="reLblType">类型</span>
      <div class="type-toggle" id="typeToggle">
        <button type="button" data-type="count"  class="on" data-i18n="reTypeCount">个数</button>
        <button type="button" data-type="bar" data-i18n="reTypeBar">进度</button>
        <button type="button" data-type="number" data-i18n="reTypeNumber">数字</button>
      </div>
    </div>

    <div class="row-2">
      <label class="field">
        <span data-i18n="reLblCurrent">当前</span>
        <input type="number" id="current" step="1" />
      </label>
      <label class="field">
        <span data-i18n="reLblMax">最大</span>
        <input type="number" id="max" step="1" min="0" />
      </label>
    </div>

    <div class="field">
      <span data-i18n="reLblIcon">图标</span>
      <div class="icon-grid" id="iconGrid"></div>
    </div>

    <div class="presets-wrap">
      <div class="lbl-row">
        <span data-i18n="rePresetsLabel">预设（名字 · 类型 · 上限 · 图标 一起存）</span>
        <button class="add" id="btnAddPreset" type="button" data-i18n="reAddPreset">+ 保存当前为预设</button>
      </div>
      <div class="chips" id="chipsPresets"></div>
    </div>

    <div class="preview-row" id="preview">
      <span class="preview-icon" id="previewIcon"></span>
      <span class="preview-label" id="previewLabel" data-i18n="rePreview">预览</span>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn danger" id="btnDelete" type="button" style="display:none" data-i18n="reBtnDelete">删除</button>
    <span style="flex:1"></span>
    <button class="btn" id="btnCancel" type="button" data-i18n="reBtnCancel">取消</button>
    <button class="btn primary" id="btnSave" type="button" data-i18n="reBtnSave">保存</button>
  </div>
</div>
<script type="module" src="/src/modules/resourceTracker/edit-page.ts"></script>
</body>
</html>
