<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>资源追踪 · 全员总览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:var(--suite-bg,#292d3c); --bg2:var(--bg-card); --bg3:var(--bg-strong);
  --border:var(--suite-border,rgba(255,255,255,0.24)); --border-strong:var(--suite-border-strong,rgba(255,255,255,0.36));
  --text:var(--suite-text,#e6e8ee); --text-dim:var(--suite-text-dim,#aab0c2); --text-mute:var(--text-dim);
  --accent:var(--suite-accent,#5dade2); --accent-dim:var(--accent); --green:var(--success); --red:var(--danger); --gold:var(--warn);
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text)}
html{background:transparent}
body{background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.rt-panel{display:flex;flex-direction:column;height:100%}

/* ===== Header ===== */
.rt-head{
  display:flex;align-items:center;gap:12px;
  padding:12px 18px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.rt-head>.ui-ico{--icon:18px;color:var(--accent);flex:none}
.rt-head-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt-title{font-size:14px;font-weight:700;letter-spacing:0.3px;line-height:1.3}
.rt-sub{font-size:11.5px;color:var(--text-mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-sub:empty::before{content:"查看全员生命值和资源；拖动预设到角色卡上即可套用"}
html[lang="en"] .rt-sub:empty::before{content:"HP and resources for everyone; drag a preset onto a card to apply it"}
.rt-close{width:30px;min-width:30px;padding:0;color:var(--text-dim)}
.rt-close:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}

/* ===== Body — the single scroll region ===== */
/* 2026-05-21 — MASONRY via CSS multi-column. The old grid forced every
   row to its tallest card's height, so a player with many resources
   stretched the whole row and left big gaps under the shorter cards.
   CSS columns let each card flow into the shortest column and pack
   tightly regardless of neighbours' heights (`break-inside:avoid` keeps
   a card whole). Vertical spacing is the card's margin-bottom since
   column-gap only spaces columns horizontally. */
.rt-body{
  flex:1;min-height:0;overflow-y:auto;
  padding:16px;
  column-width:300px;
  column-gap:14px;
}
.rt-body::-webkit-scrollbar{width:8px}
.rt-body::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}

.rt-empty{
  column-span:all;
  text-align:center;color:var(--text-mute);
  font-size:13px;line-height:1.9;padding:60px 20px;
}

/* ===== Player/Monster tab switcher (header right) ===== */
.rt-tabs{display:flex;gap:0;flex-shrink:0;border:1px solid var(--border-strong);border-radius:7px;overflow:hidden}
.rt-tab{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;
  background:transparent;border:none;cursor:pointer;
  color:var(--text-dim);font-family:inherit;font-size:12px;font-weight:700;
  transition:background .12s,color .12s;
}
.rt-tab + .rt-tab{border-left:1px solid var(--border-strong)}
.rt-tab:hover{background:var(--tint);color:var(--text)}
.rt-tab.on[data-tab="player"]{background:var(--warn-soft);color:var(--gold)}
.rt-tab.on[data-tab="monster"]{background:var(--accent-soft);color:var(--accent-dim)}
.rt-tab-n{
  font-family:ui-monospace,Consolas,monospace;font-size:10px;
  padding:1px 6px;border-radius:999px;background:var(--tint);color:inherit;
}

/* 2026-05-16 — section divider between player + monster groups.
   Spans the full grid row via grid-column:1/-1; renders as a
   small heading + bottom hairline. Monster divider uses the
   bestiary purple tone; player divider stays in the gold accent
   so the DM can distinguish at a glance. */
.rt-section-divider{
  grid-column:1/-1;
  display:flex;align-items:center;gap:10px;
  font-size:12px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;
  color:var(--gold);
  padding:4px 2px;
  margin-top:4px;
}
.rt-section-divider:first-child{margin-top:0}
.rt-section-divider::after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg, var(--border-strong), transparent);
}
.rt-section-divider[data-kind="monster"]{color:var(--accent-dim)}

/* ===== Character card ===== */
.rt-char{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:10px;
  display:flex;flex-direction:column;
  overflow:hidden;
  /* masonry: keep each card whole within a column + provide the
     vertical gap (column-gap is horizontal-only). */
  break-inside:avoid;
  -webkit-column-break-inside:avoid;
  margin-bottom:14px;
  width:100%;
}
.rt-char-head{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;
  background:var(--bg3);
  border-bottom:1px solid var(--border);
}
.rt-char-name{font-size:14px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.rt-char-owner{
  font-size:10px;color:var(--accent-dim);
  background:var(--accent-soft);
  border:1px solid var(--accent-line);
  border-radius:999px;padding:2px 8px;flex-shrink:0;
  white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;
}
/* Stat banner + resource section — both mount the same components the
   character-card info popover uses (mountStatBanner + mountResourcePanel),
   which inject their own CSS at runtime. These mount divs just give the
   components a little padding inside the card. */
.rt-stat-mount{padding:6px 10px 0}
.rt-res-mount{padding:4px 8px 8px}

/* ===== Presets bar (2026-05-15) — bundle-presets that snapshot a
   character's full resource list. Click a chip = action menu
   (overwrite-all / merge-all / rename / delete). Drag a chip = drop
   onto a character card to apply just to that one. ===== */
.rt-presets-bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:5px;
  padding:7px 18px;
  background:var(--bg-strong);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  position:relative;
}
.rt-presets-lbl{
  font-size:10px;color:var(--text-dim);letter-spacing:0.6px;
  font-weight:700;text-transform:uppercase;padding-right:4px;
}
.rt-presets-empty{
  font-size:10.5px;color:var(--text-mute);letter-spacing:0.2px;flex:1;
}
.rt-preset-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 5px 3px 9px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  font-size:11px;color:var(--text);font-family:inherit;
  cursor:pointer;user-select:none;
  transition:background .12s,border-color .12s,color .12s;
}
.rt-preset-chip:hover{
  background:var(--accent-soft);
  border-color:var(--accent-line);
}
.rt-preset-chip .pre-count{
  font-size:9.5px;color:var(--text-dim);
  font-family:ui-monospace,Consolas,monospace;
  padding:0 4px;background:var(--tint);
}
.rt-preset-actions{margin-left:auto;display:flex;gap:5px}
.rt-preset-actions button{font-size:11px;min-height:26px;padding:0 9px}
.rt-preset-menu{
  position:absolute;z-index:30;
  background:var(--bg2);
  border:1px solid var(--border-strong);
  box-shadow:0 8px 24px var(--shadow);
  display:flex;flex-direction:column;
  min-width:200px;
  font-size:11.5px;
}
.rt-preset-menu button{
  background:transparent;border:none;color:var(--text);
  font-family:inherit;font-size:11.5px;font-weight:600;
  padding:8px 14px;text-align:left;cursor:pointer;
  border-bottom:1px solid var(--border);
  transition:background .12s,color .12s;
}
.rt-preset-menu button:last-child{border-bottom:none}
.rt-preset-menu button:hover{background:var(--accent-soft);color:var(--accent-dim)}
.rt-preset-menu button.danger:hover{background:var(--danger-soft);color:var(--danger)}

/* Per-card "save as preset" button — shows in each character card's
   head row, only visible on hover so it doesn't clutter the panel. */
.rt-char-save-preset{
  flex-shrink:0;font-size:10px;color:var(--text-dim);
  background:transparent;border:1px solid transparent;
  border-radius:var(--radius);padding:2px 7px;cursor:pointer;
  font-family:inherit;
  opacity:0;transition:opacity .12s, background .12s, color .12s, border-color .12s;
}
.rt-char:hover .rt-char-save-preset{opacity:1}
.rt-char-save-preset{display:inline-flex;align-items:center;gap:4px;min-height:24px}
.rt-char-save-preset:hover{
  background:var(--success-soft);
  border-color:var(--success-line);
  color:var(--success);
}

/* Drop-target highlight while a preset chip is being dragged over
   a character card. */
.rt-char.drop-target{
  border-color:var(--green);
  box-shadow:0 0 0 1px var(--green), 0 0 12px var(--success-line);
}

/* Hidden file input for JSON import. */
.rt-file-import{display:none}
</style>
</head>
<body>
<div class="rt-panel">
  <header class="rt-head">
    <svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
    <div class="rt-head-text"><span class="rt-title" data-i18n="rtTitle">资源追踪</span><span class="rt-sub" id="rtSub"></span></div>
    <div class="rt-tabs" id="rtTabs">
      <button class="rt-tab on" data-tab="player" id="rtTabPlayer" type="button"><span data-i18n="rtTabPlayers">玩家</span> <span class="rt-tab-n" id="rtTabPlayerN">0</span></button>
      <button class="rt-tab" data-tab="monster" id="rtTabMonster" type="button"><span data-i18n="rtTabMonsters">怪物</span> <span class="rt-tab-n" id="rtTabMonsterN">0</span></button>
    </div>
    <button class="rt-close btn btn-ghost" id="rtClose" type="button" title="关闭" aria-label="关闭"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </header>
  <div class="rt-presets-bar" id="rtPresetsBar">
    <span class="rt-presets-lbl" data-i18n="rtPresetsLbl">预设</span>
    <span class="rt-presets-empty" id="rtPresetsEmpty" data-i18n-html="rtPresetsEmpty">还没有预设。鼠标移到某张角色卡上点「+ 存为预设」可保存其当前资源；保存后这里出现的 chip：<b>点击</b>=覆盖/叠加给全员、<b>拖到角色卡上</b>=只给那一张。</span>
    <span id="rtPresetsList" style="display:inline-flex;flex-wrap:wrap;gap:4px"></span>
    <span class="rt-preset-actions">
      <button class="io btn btn-sm" id="rtPresetExport" type="button" data-i18n="rtExport"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>导出</button>
      <button class="io btn btn-sm" id="rtPresetImport" type="button" data-i18n="rtImport"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12"/><path d="M17 8l-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>导入</button>
      <input type="file" id="rtPresetFile" class="rt-file-import" accept=".json,application/json">
    </span>
  </div>
  <div class="rt-body" id="rtBody"></div>
</div>
<script type="module" src="/src/resource-tracker-page.ts"></script>
</body>
</html>
