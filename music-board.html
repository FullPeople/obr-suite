<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音乐板</title></head>
<body><main class="music-app">
<header class="music-header"><button id="drag" class="plain grip" type="button" aria-label="拖动音乐板">⠿</button><strong data-mt="title"></strong><span id="saved" class="save-state"></span><button id="mini" class="plain" type="button">−</button><button id="close" class="plain" type="button">×</button></header>
<section class="music-deck" aria-label="播放控制"><div class="now"><span id="status"></span><strong id="name"></strong><span id="time"></span></div>
<div class="transport"><button id="previous" type="button" data-mt="previous" data-shared></button><button id="play" class="primary" type="button" data-shared></button><button id="next" type="button" data-mt="next" data-shared></button><button id="stop" type="button" data-mt="stop" data-shared></button><button id="loop" type="button" aria-pressed="false" data-mt="loop" data-shared></button></div>
<input id="seek" type="range" min="0" max="100" value="0" step="1" aria-label="播放进度" data-shared>
<div class="deck-bottom"><div id="soundNotice"><button id="enable" type="button" data-mt="enable"></button><span id="soundMessage"></span></div><details class="volume-details"><summary data-mt="volume"></summary><div class="volume-popover"><strong data-mt="localVolume"></strong><button id="mute" type="button" aria-pressed="false" data-mt="mute"></button><label><span data-mt="busBgmShort"></span><input id="bgmVolume" type="range" min="0" max="100" value="80"><output id="bgmVolumeValue">80</output></label><label><span data-mt="busSfxShort"></span><input id="sfxVolume" type="range" min="0" max="100" value="100"><output id="sfxVolumeValue">100</output></label><strong data-mt="roomVolume"></strong><label><span data-mt="busBgmShort"></span><input id="roomBgmVolume" type="range" min="0" max="100" value="80" data-shared><output id="roomBgmVolumeValue">80</output></label><label><span data-mt="busSfxShort"></span><input id="roomSfxVolume" type="range" min="0" max="100" value="100" data-shared><output id="roomSfxVolumeValue">100</output></label></div></details><label id="permission" hidden><input id="allowPlayers" type="checkbox"><span data-mt="allow"></span></label></div>
<p id="readOnly" class="hint" hidden data-mt="readOnly"></p></section>
<div class="music-workspace" data-view="library"><nav class="workspace-switch" aria-label="音乐板内容"><button type="button" data-view="library" aria-pressed="true" data-mt="library"></button><button type="button" data-view="queue" aria-pressed="false" data-mt="queue"></button></nav>
<section class="library-pane"><div class="library-tools"><input id="search" type="search" data-mt-placeholder="search" aria-label="搜索曲库"><span id="libraryCount"></span><button id="addTrack" class="primary" type="button" data-mt="addTrack" data-shared></button><button id="openImport" type="button" data-mt="import"></button><button id="export" type="button" data-mt="export"></button><button id="backup" type="button" data-mt="backup"></button><button id="defaults" type="button" data-mt="defaults"></button></div>
<div class="filter-row" id="busFilter" aria-label="曲目类型"><button type="button" data-bus="all" aria-pressed="true" data-mt="all"></button><button type="button" data-bus="bgm" aria-pressed="false" data-mt="busBgm"></button><button type="button" data-bus="sfx" aria-pressed="false" data-mt="busSfx"></button><button id="favorites" type="button" aria-pressed="false" data-mt="favorites"></button><button id="enqueueVisible" type="button" data-mt="enqueueVisible" data-shared></button></div>
<div class="facets"><div id="groupFilter" class="chip-row" aria-label="分组筛选"></div><div id="tagFilter" class="chip-row" aria-label="标签筛选"></div></div><div id="library" class="track-grid"></div></section>
<aside class="queue-pane"><div class="pane-heading"><h2 data-mt="queue"></h2><span id="queueCount"></span><button id="clearQueue" type="button" data-mt="clearQueue" data-shared></button></div><div id="queue" class="queue-list"></div><section id="sfxSection" hidden><div class="pane-heading"><h2 data-mt="sounds"></h2><span id="sfxCount"></span><button id="clearSfx" type="button" data-mt="clearSfx" data-shared></button></div><div id="sfx"></div></section></aside></div>
<footer><p id="feedback" role="status"></p></footer>
<dialog id="trackDialog"><form id="trackForm"><div class="dialog-heading"><h2 id="trackDialogTitle"></h2><button type="button" data-close="trackDialog" data-mt="cancel"></button></div><label><span data-mt="trackName"></span><input id="trackName" type="text" maxlength="100" autocomplete="off"></label><label><span data-mt="trackUrl"></span><input id="trackUrl" type="url" required maxlength="2048" placeholder="https://…" autocomplete="off"></label><div class="choice-row" id="trackBus"><button type="button" data-bus="bgm" aria-pressed="true" data-mt="busBgm"></button><button type="button" data-bus="sfx" aria-pressed="false" data-mt="busSfx"></button></div><div class="choice-row" id="trackLoop"><button type="button" data-loop="false" aria-pressed="false" data-mt="once"></button><button type="button" data-loop="true" aria-pressed="true" data-mt="loop"></button></div><div class="form-pair"><label><span data-mt="group"></span><input id="trackGroup" type="text" maxlength="24" autocomplete="off"></label><label><span data-mt="tags"></span><input id="trackTags" type="text" maxlength="155" data-mt-placeholder="tagsHint" autocomplete="off"></label></div><label class="slider-label"><span data-mt="trackVolume"></span><input id="trackVolume" type="range" min="0" max="100" value="100"><output id="trackVolumeValue">100</output></label><div class="choice-row" id="trackColor" aria-label="曲目颜色"></div><p id="trackError" class="form-error" role="alert"></p><div class="dialog-actions"><button id="deleteTrack" type="button" class="danger" data-mt="remove" hidden data-shared></button><button id="saveTrack" type="submit" class="primary" data-mt="saveTrack" data-shared></button></div></form></dialog>
<dialog id="importDialog"><div class="dialog-heading"><h2 data-mt="import"></h2><button type="button" data-close="importDialog" data-mt="cancel"></button></div><textarea id="importText" rows="5" data-mt-placeholder="input" aria-label="导入内容"></textarea><div class="choice-row" id="importBus"><button type="button" data-bus="bgm" aria-pressed="true" data-mt="busBgm"></button><button type="button" data-bus="sfx" aria-pressed="false" data-mt="busSfx"></button></div><div class="row"><button id="readFile" type="button" data-mt="readFile"></button><input id="importFile" type="file" accept=".json,.txt,application/json,text/plain" hidden><button id="previewImport" type="button" data-mt="previewImport"></button></div><div id="importPreview" hidden><p id="importSummary"></p><ol id="importList"></ol><div class="choice-row" id="importMode"><button type="button" data-mode="merge" aria-pressed="true" data-mt="merge"></button><button type="button" data-mode="replace" aria-pressed="false" data-mt="replace"></button></div><p id="replaceHint" class="hint" hidden data-mt="replaceHint"></p><button id="applyImport" class="primary" type="button" data-mt="applyImport" data-shared></button></div><p id="importError" class="form-error" role="alert"></p></dialog>
<dialog id="catalogDialog"><div class="dialog-heading"><h2 data-mt="defaults"></h2><button type="button" data-close="catalogDialog" data-mt="cancel"></button></div><p class="hint" data-mt="sourceLimit"></p><input id="catalogSearch" type="search" data-mt-placeholder="search" aria-label="搜索默认曲库"><div id="catalogTracks"></div><p id="catalogError" class="form-error" role="status"></p></dialog>
</main><script type="module" src="./src/music-board-page.ts"></script></body></html>
