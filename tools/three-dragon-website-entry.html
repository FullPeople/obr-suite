<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="color-scheme" content="dark">
 <title>三龙牌 · 线上网站</title>
 <style>
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#171d28;color:#edf1f7;font:16px/1.7 system-ui,sans-serif}body{display:grid;place-items:center;padding:24px}main{width:min(100%,540px);padding:28px;border:1px solid #526176;border-radius:12px;background:#212a39}h1{margin:0 0 12px;font-size:26px}p{margin:12px 0;color:#c6d0df}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}a.primary,button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:1px solid #829dc4;border-radius:8px;background:#e8d7aa;color:#202b3a;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}button{background:#283449;color:#edf1f7}a:focus-visible,button:focus-visible{outline:3px solid #e8d7aa;outline-offset:4px}.url{color:#d9e4f5;overflow-wrap:anywhere}.hint{font-size:14px}button[hidden]{display:none}
 </style>
</head>
<body>
 <main>
  <h1>三龙牌 · 传奇版</h1>
  <p>在独立网站创建房间，分享房间码或邀请链接，与朋友一起打牌。</p>
  <p>新标签页打开牌桌后，当前 Suite 工作区仍保留，随时可以回来。</p>
  <div class="actions">
   <a class="primary" href="https://dnd.center/3-dragon/" target="_blank" rel="noopener noreferrer">打开线上三龙牌</a>
   <button id="return" type="button" hidden>返回 Suite 工作区</button>
  </div>
  <p class="hint">也可以打开或复制下面的链接：</p>
  <a class="url" href="https://dnd.center/3-dragon/" target="_blank" rel="noopener noreferrer">https://dnd.center/3-dragon/</a>
 </main>
 <script>
  if(window.parent!==window&&location.pathname.includes('/workbench-panels/')){
   const button=document.getElementById('return');button.hidden=false;
   button.addEventListener('click',()=>parent.postMessage({channel:'workbench-panel-frame/v1',close:true},location.origin));
  }
 </script>
</body>
</html>
