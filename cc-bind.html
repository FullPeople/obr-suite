<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>绑定角色卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:var(--suite-bg,#292d3c);--bg-card:var(--suite-bg-card,#323748);--bg-strong:var(--suite-bg-strong,#1f2230);--text:var(--suite-text,#e6e8ee);--text-dim:var(--suite-text-dim,#aab0c2);--border:var(--suite-border,rgba(255,255,255,0.24));--border-strong:var(--suite-border-strong,rgba(255,255,255,0.36));--accent:var(--suite-accent,#5dade2);--accent-ink:var(--suite-accent-ink,#0b1320);--danger:var(--suite-danger,#e74c3c)}
html,body{height:100%;overflow:hidden;font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg)}
.wrap{height:100%;display:flex;flex-direction:column}
.search-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.search-row .search-box{position:relative;flex:1;min-width:0}
.search-row .search-box .ui-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-dim);--icon:14px;pointer-events:none}
.search-row input{width:100%;padding-left:28px}
.search-row .count{font-size:11px;color:var(--text-dim);white-space:nowrap}
.list{flex:1;overflow-y:auto;padding:8px 12px}
.list .list-row{min-height:44px}
.list .row-icon{color:var(--accent)}
.list .row-icon.cloud{color:var(--warn)}
.list .row-sub .dot{opacity:.5}
.foot-cur{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.foot-cur .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-block;line-height:20px}
.foot-cur:empty{display:none}
.explain{padding:8px 12px 0;font-size:11.5px;color:var(--text-dim);line-height:1.5;flex-shrink:0}
.page-foot{flex-wrap:wrap;gap:6px 8px}
.page-foot .btn{flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13 19a4 4 0 00-8 0"/><path d="M16 10h2"/><path d="M16 14h2"/><circle cx="9" cy="12" r="3"/><rect x="2" y="5" width="20" height="14" rx="2"/></svg>
    <div class="page-text">
      <h1 data-i18n="ccBindTitle">绑定角色卡</h1>
      <div class="page-sub" id="tokenName" data-i18n="ccBindTokenLoading">正在读取令牌…</div>
    </div>
  </header>
  <div class="explain" data-i18n="ccBindExplain">选一张卡绑定到这个令牌。绑定后，令牌会读取这张卡的生命值、AC、先攻加值和资源；单选令牌时自动弹出角色信息。</div>
  <div class="search-row">
    <label class="search-box"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="ccBindSearchPh" placeholder="按名称筛选角色卡" aria-label="筛选角色卡"></label>
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"><div class="empty-state" data-i18n="ccBindLoading">加载中…</div></div>
  <footer class="page-foot">
    <div class="foot-cur" id="cur"></div>
    <button class="btn btn-sm btn-danger" id="unbind" type="button" data-i18n="ccBindUnbind" style="display:none">解绑</button>
  </footer>
</div>
<script type="module" src="/src/modules/characterCards/bind-page.ts"></script>
</body>
</html>
