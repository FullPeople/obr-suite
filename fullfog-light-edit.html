<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>光源设置 · fullFog</title>
    <!--
      Deliberately the same six controls as upstream dynamic-fog's
      Menu.tsx — Range / Angle / Edge / Type, then Rotate / Remove — so
      anyone who has used the official extension already knows this
      panel. The core-radius and falloff sliders that used to sit here
      were removed: Edge already picks the two falloff values anyone
      actually wants, and a raw source-radius slider is a footgun (too
      large and a torch stops fitting through a doorway).

      "Ambient" is ours, not upstream's, and it is load-bearing for
      light occlusion — without it a wall sconce is invisible to any
      player who is not carrying their own torch. Rather than spend a
      whole extra field on it, it rides in the Type group as a third
      option, so the panel keeps upstream's shape.
    -->
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 10px 14px 12px;
        background: #1c1f27; color: #e6e8ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                     "Microsoft YaHei", Roboto, sans-serif;
        font-size: 13px;
        user-select: none;
      }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
      .field { min-width: 0; }
      .lbl {
        display: block; font-size: 11px; color: #9aa0ad;
        margin-bottom: 4px; letter-spacing: .02em;
      }
      .seg { display: flex; gap: 4px; }
      .seg button {
        /* min-width:0 matters: a flex item defaults to min-width:auto,
           so the three-button Type group refuses to shrink below its
           icons and overflows its grid column in a narrow popover. */
        flex: 1; min-width: 0; height: 30px; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
        background: #252934; color: #b9bfcc;
        border: 1px solid #3b4150; border-radius: 4px;
        cursor: pointer; font: inherit; font-size: 12px;
      }
      .seg button:hover { background: #2e3340; }
      .seg button[aria-pressed="true"] {
        background: #3a3320; border-color: #f5a623; color: #f5a623;
      }
      .seg svg { width: 18px; height: 18px; display: block; }
      .num {
        display: flex; align-items: center; gap: 6px;
        height: 30px; padding: 0 8px;
        background: #252934; border: 1px solid #3b4150; border-radius: 4px;
      }
      .num input {
        flex: 1; min-width: 0; width: 100%;
        background: transparent; border: 0; outline: none;
        color: #e6e8ee; font: inherit; font-variant-numeric: tabular-nums;
      }
      .num .unit { font-size: 11px; color: #7d8494; flex: none; }
      .actions { display: flex; gap: 8px; margin-top: 10px; }
      .actions button {
        flex: 1; height: 30px;
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        background: #252934; color: #e6e8ee;
        border: 1px solid #3b4150; border-radius: 4px;
        cursor: pointer; font-size: 12px; font-family: inherit;
      }
      .actions button:hover { background: #2e3340; }
      .actions button.danger { border-color: #6c2a2a; color: #ffb0b0; }
      .actions button.danger:hover { background: #3a1d1d; }
      .actions button svg { width: 16px; height: 16px; }
      .hidden { display: none !important; }
      #status { font-size: 11.5px; color: #9aa0ad; padding: 6px 0 2px; }
    </style>
  </head>
  <body>
    <div id="status" class="hidden"></div>

    <div id="panel">
      <div class="grid">
        <div class="field">
          <span class="lbl" data-en="Range">照明范围</span>
          <div class="num">
            <input id="range" type="text" inputmode="decimal" autocomplete="off" value="30" />
            <span class="unit" id="range-unit">ft</span>
          </div>
        </div>

        <div class="field">
          <span class="lbl" data-en="Angle">角度</span>
          <div class="seg" id="angle">
            <button type="button" data-value="FULL" title="全向" data-en-title="Full">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
            </button>
            <button type="button" data-value="CONE" title="锥形" data-en-title="Cone">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12 L4 4 A11.3 11.3 0 0 1 20 4 Z"/></svg>
            </button>
          </div>
        </div>

        <div class="field">
          <span class="lbl" data-en="Edge">边缘</span>
          <div class="seg" id="edge">
            <button type="button" data-value="HARD" title="硬边" data-en-title="Hard">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
            </button>
            <button type="button" data-value="SOFT" title="柔边" data-en-title="Soft">
              <svg viewBox="0 0 24 24"><defs><radialGradient id="sg"><stop offset="30%" stop-color="currentColor" stop-opacity="1"/><stop offset="100%" stop-color="currentColor" stop-opacity="0"/></radialGradient></defs><circle cx="12" cy="12" r="9" fill="url(#sg)"/></svg>
            </button>
          </div>
        </div>

        <div class="field">
          <span class="lbl" data-en="Type">类型</span>
          <div class="seg" id="type">
            <button type="button" data-value="PRIMARY" title="主光源：照亮并揭开迷雾" data-en-title="Primary — casts light and clears fog">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7" r="3.4"/><path d="M5 21v-1.6c0-3.2 3.1-5.2 7-5.2s7 2 7 5.2V21z"/></svg>
            </button>
            <button type="button" data-value="SECONDARY" title="次光源：只照亮已被主光源看到的区域" data-en-title="Secondary — only lights fog a primary light already sees">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c2.5 4 5.5 5.4 5.5 9.4A5.5 5.5 0 0 1 12 17a5.5 5.5 0 0 1-5.5-5.6C6.5 7.4 9.5 6 12 2z"/><path d="M4 20h16v2H4z"/></svg>
            </button>
            <button type="button" data-value="AMBIENT" title="环境光：公开照明与视野；隐藏、显式归属或私密卡限制优先" data-en-title="Ambient: public lighting and vision; hidden items, explicit ownership and private cards take precedence">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/><path d="M11 1h2v3.4h-2zm0 18.6h2V23h-2zM1 11h3.4v2H1zm18.6 0H23v2h-3.4zM4.2 5.6l1.4-1.4 2.4 2.4-1.4 1.4zm11.8 11.8 1.4-1.4 2.4 2.4-1.4 1.4zM4.2 18.4l2.4-2.4 1.4 1.4-2.4 2.4zM16 6.6l2.4-2.4 1.4 1.4-2.4 2.4z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="btn-rotate" class="hidden" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
          <span data-en="Rotate">旋转</span>
        </button>
        <button id="btn-remove" class="danger" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a7 7 0 0 1 4.2 12.6c-.8.6-1.2 1-1.2 1.9v.5H9v-.5c0-.9-.4-1.3-1.2-1.9A7 7 0 0 1 12 3zM9 20h6v1a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/><path d="M3.5 2.1 21.9 20.5l-1.4 1.4L2.1 3.5z"/></svg>
          <span data-en="Remove">移除光源</span>
        </button>
      </div>
    </div>

    <script type="module" src="/src/modules/fullFog/dynfog/light/edit-page.ts"></script>
  </body>
</html>
