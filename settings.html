<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>枭熊插件 — 设置</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:var(--suite-bg,#292d3c);--bg-strong:var(--suite-bg-strong,#1f2230);--bg-card:var(--suite-bg-card,#323748);
  --border:var(--suite-border,rgba(255,255,255,0.24));--border-strong:var(--suite-border-strong,rgba(255,255,255,0.36));
  --text:var(--suite-text,#e6e8ee);--text-dim:var(--suite-text-dim,#aab0c2);
  --accent:var(--suite-accent,#5dade2);--accent-warm:var(--warn);--accent-red:var(--danger);--accent-green:var(--success);
  --kofi:var(--danger);
}
html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;overflow:hidden}
body{display:flex;flex-direction:column;border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 12px 36px var(--shadow)}

.head{
  flex-shrink:0;padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.head h1{font-size:15px;font-weight:700;letter-spacing:0.3px}
.lang-switch{
  display:flex;background:var(--bg-strong);border:1px solid var(--border);
  border-radius:5px;overflow:hidden;
}
.lang-switch button{
  background:transparent;border:none;color:var(--text-dim);
  padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;
  font-family:inherit;letter-spacing:0.5px;
}
.lang-switch button.on{background:var(--accent-soft);color:var(--accent)}
.lang-switch button + button{border-left:1px solid var(--border)}

.main{flex:1;min-height:0;display:flex}
.tabs{
  width:160px;flex-shrink:0;
  border-right:1px solid var(--border);
  background:var(--bg-strong);
  overflow-y:auto;padding:8px 0;
}
.tabs::-webkit-scrollbar{width:5px}
.tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tab{
  display:flex;align-items:center;gap:6px;width:100%;
  padding:9px 14px;
  background:transparent;border:none;
  color:var(--text-dim);font-family:inherit;font-size:12px;text-align:left;
  cursor:pointer;
  border-left:3px solid transparent;
  transition:background .12s, color .12s, border-color .12s;
}
.tab:hover{background:var(--tint);color:var(--text)}
.tab.on{background:var(--accent-soft);color:var(--text);border-left-color:var(--accent);font-weight:700}
/* Inline "调试中" / BETA chip on tab labels for in-development modules.
   Distinct color (warm amber) + tighter font so it doesn't crowd the
   tab title. */
.tab .tab-beta{
  display:inline-block;
  margin-left:6px;
  padding:1px 5px;
  font-size:9px;font-weight:800;
  color:#1a1a2e;
  background:var(--warn-line);
  border-radius:3px;
  letter-spacing:0.3px;
  vertical-align:1px;
}
.tab .tab-sub{display:block;font-size:9.5px;color:var(--text-dim);margin-top:2px;letter-spacing:0.5px}
.tab .ui-icon{color:var(--text-dim)}
.tab.on .ui-icon{color:var(--accent)}
.settings-credit{margin:14px 0 4px;font-size:10.5px;color:var(--text-dim);text-align:right}
.plain-list{padding-left:18px;margin:0}
.plain-list li{color:var(--text-dim);font-size:12px;margin-bottom:4px}

/* Distinct accent colors for the first three "section" tabs so they
   visually stand out from the per-module tabs underneath. Each gets its
   own active border-left + active text tint. Inactive (rest) state
   keeps a subtle hue badge so the user can spot them at a glance. */



/* Library settings — purple accent so it visually stands out from the
   per-module tabs (mirrors the section-tab convention above). */

.content-wrap{
  flex:1;min-width:0;
  display:flex;flex-direction:column;
}

/* Per-tab top bar: title (left) + plugin enable toggle (right, only for
   plugin tabs that actually have a flag) */
.top-bar{
  flex-shrink:0;
  padding:12px 22px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--border);
}
.top-bar h2{font-size:14px;font-weight:700;color:var(--text);letter-spacing:0.2px;display:flex;align-items:center;gap:6px;--icon:18px}
.top-bar .meta{font-size:10.5px;color:var(--text-dim)}

.content{
  flex:1;min-height:0;
  overflow-y:auto;padding:14px 22px;
  line-height:1.65;
}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.content h3{font-size:12.5px;font-weight:700;color:var(--accent-warm);margin-top:14px;margin-bottom:6px;letter-spacing:0.3px}

/* Bold text inside descriptions gets a tint so it actually pops
   against the prose. Without this, <b> just bumps weight which is
   nearly invisible on the dark background at 12.5px. Three tints:
   - .content b — default warm gold for emphasised terms
   - <em> — secondary lighter blue (used for "verb / button name"
     references that still want highlight but not as loud as bold)
   - <kbd> — pill-style chip for keystrokes. */
.content b{color:var(--warn);font-weight:700}
.content em{color:var(--accent);font-style:normal}
.content kbd{
  display:inline-block;
  padding:1px 6px;
  font-family:ui-monospace,Consolas,monospace;
  font-size:10.5px;font-weight:700;
  color:var(--text);
  background:var(--tint);
  border:1px solid var(--border);
  border-bottom-width:2px;
  border-radius:4px;
  letter-spacing:0.2px;
  vertical-align:1px;
}
.content code{
  font-family:ui-monospace,Consolas,monospace;
  font-size:11px;
  color:var(--accent);
  background:var(--accent-soft);
  border:1px solid var(--accent-soft);
  border-radius:4px;
  padding:0 4px;
}

/* Collapsible rule blocks (e.g. dice expression syntax) — keeps the
   default state compact since most users don't need the full
   reference card on every visit. */
.rules-collapse{
  border:1px solid var(--border);
  border-radius:6px;
  margin:10px 0;
  background:var(--tint);
}
.rules-collapse > summary{
  cursor:pointer;
  padding:8px 12px;
  font-size:12px;
  color:var(--text);
  user-select:none;
  border-radius:6px;
  list-style:none;
}
.rules-collapse > summary::-webkit-details-marker{display:none}
.rules-collapse > summary::before{
  content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);
  display:inline-block;
  margin-right:6px;
  font-size:10px;
  color:var(--accent);
  transition:transform .15s;
}
.rules-collapse[open] > summary::before{transform:rotate(90deg)}
.rules-collapse > summary:hover{background:var(--tint)}
.rules-collapse > ul{padding:6px 14px 12px 30px}
.content h3:first-child{margin-top:0}
.content p{margin-bottom:8px;color:var(--text);font-size:12.5px}
.content ul{padding-left:18px;margin-bottom:10px}
.content li{margin-bottom:4px;color:var(--text);font-size:12.5px}
.content a{color:var(--accent);text-decoration:none}
.content a:hover{text-decoration:underline}

/* === Toggle switch === */
.tog{
  flex-shrink:0;width:42px;height:22px;
  background:var(--bg-strong);border:1px solid var(--border);
  border-radius:11px;cursor:pointer;padding:0;position:relative;
  transition:background .18s, border-color .18s;
}
.tog::before{
  content:"";position:absolute;top:1px;left:1px;
  width:18px;height:18px;background:var(--text-dim);border-radius:50%;
  transition:left .18s, background .18s;
}
.tog.on{background:var(--success-line);border-color:var(--success-line)}
.tog.on::before{left:21px;background:var(--success)}
.tog:disabled{opacity:0.45;cursor:not-allowed}

/* === 3-segment slider for data version ===
   Sized to its content (was visually extending toward the panel
   edge thanks to surrounding flex children). `width:fit-content`
   guarantees it hugs the buttons; the buttons themselves use
   tighter horizontal padding so the overall pill is compact. */
.seg{
  display:inline-flex;align-items:center;
  width:fit-content;
  background:var(--bg-strong);border:1px solid var(--border-strong);
  border-radius:8px;overflow:hidden;height:32px;
  margin:8px 0;
}
.seg button{
  background:transparent;border:none;
  color:var(--text-dim);font-family:inherit;font-size:11.5px;font-weight:700;
  padding:0 12px;height:100%;cursor:pointer;letter-spacing:0.3px;
  border-right:1px solid var(--border);
  transition:background .12s, color .12s;
}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--tint);color:var(--text)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg button:disabled{cursor:not-allowed;opacity:0.5}

.row{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:4px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px}
.row .lbl{flex:1;min-width:0}
.row .row{margin:0;padding:0;border:0;background:transparent}
.row .lbl .desc{font-size:10.5px;color:var(--text-dim);margin-top:1px}

.warn{
  background:var(--warn-soft);
  border:1px solid var(--warn-line);
  border-radius:6px;padding:8px 10px;font-size:11px;color:var(--warn);
  margin-top:10px;line-height:1.5;
}
.note{
  background:var(--tint);
  border-left:3px solid var(--accent-warm);
  padding:9px 12px;margin-top:10px;font-size:11.5px;color:var(--text-dim);border-radius:0 4px 4px 0;line-height:1.6;
}

/* Support tab buttons — muted style; uses tinted background rather than
   their full brand colors so they read as part of the suite UI rather
   than competing for attention. */
.support-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 8px}
.support-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:6px;
  font-family:inherit;font-size:12px;font-weight:500;
  text-decoration:none;
  background:var(--tint);
  border:1px solid var(--border);
  color:var(--text);
  transition:background .15s, border-color .15s;
}
.support-btn:hover{
  text-decoration:none;
  background:var(--tint);
  border-color:var(--border-strong);
}
.support-btn.kofi:hover{border-color:rgba(255,94,91,0.4)}
.support-btn.kofi .ic{color:var(--kofi)}
.support-btn .ic{font-size:14px;line-height:1}

/* WeChat / Alipay QR thumbnails sit next to the Ko-fi
   buttons in the support-row. Kept compact (54×54) so they don't
   tower over the buttons; hovering enlarges + dims the rest so the
   user can scan with their phone without opening a separate page. */
.qr-pair{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 5px;
  background:var(--tint);
  border:1px solid var(--border);
  border-radius:6px;
}
.qr-thumb{
  width:54px;height:54px;
  object-fit:cover;
  border-radius:4px;
  background:#fff;        /* QR codes need a white backing */
  border:1px solid var(--border);
  cursor:zoom-in;
  transition:transform .18s ease-out, box-shadow .18s ease-out, z-index 0s;
}
.qr-thumb:hover{
  transform:scale(3.4);
  transform-origin:center center;
  box-shadow:0 8px 24px var(--shadow), 0 0 0 1px rgba(0,0,0,0.4);
  position:relative;
  z-index:50;
}
.contact-box{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-top:10px;font-size:12px}
.contact-box code{font-family:ui-monospace,Consolas,monospace;color:var(--accent)}

/* 2026-05-12 — "tell me your portrait" CTA block replacing the old
   inline backer wall (which now drifts around the screen behind
   this panel via the supporter-overlay modal). */
.thanks-call-to-action{
  background:linear-gradient(135deg, rgba(255,140,58,0.12), rgba(216,196,104,0.08));
  border:1px solid var(--warn-line);
  border-radius:8px;
  padding:12px 16px;
  margin-top:10px;
  font-size:12.5px;
  line-height:1.55;
}
.thanks-call-to-action p{margin:0}
.thanks-call-to-action p + p{margin-top:4px}
.thanks-call-to-action b{color:var(--warn)}
.thanks-call-to-action code{
  font-family:ui-monospace,Consolas,monospace;
  color:var(--accent);
  font-size:12px;
}
.thanks-call-to-action a{color:inherit; text-decoration:underline}
.thanks-call-to-action a:hover{color:var(--warn)}

/* Backer-credit list (Support tab → 鸣谢 / Thanks block).
   Each name has a rainbow text-shadow that cycles through six hues
   over a 6-second loop. text-shadow is rendered directly underneath
   each glyph, so the halo conforms to the GLYPH SHAPE — not a
   rectangle behind the chip. The earlier conic-gradient ::before
   approach distorted into a rotating ellipse on long names; this
   keeps the halo glyph-aligned at every name length. The text
   itself paints on top of its own shadow by definition, so the
   "name index above all halos" requirement is automatic. */
.backers-box{
  background:var(--bg-card);border:1px solid var(--border);border-radius:6px;
  padding:7px 10px;margin-top:6px;font-size:11px;
}
.backers-box p{margin:0 0 5px;font-size:11px;color:var(--text)}
.backers{display:flex;flex-wrap:wrap;gap:6px 12px;margin:4px 0;line-height:1.6}
.backer{
  display:inline-block;
  padding:0 1px;
  color:var(--text);
  font-weight:600;
  letter-spacing:0.2px;
  animation:backer-glow 6s linear infinite;
}
/* 2026-05-18 — when a supporter has a matching pic in
   /shared/pics/, supportersHtml prepends a small <img class="backer-
   avatar"> whose width/height match the supporter chip's font-size.
   inline-flex aligns the img + name baselines cleanly. `vertical-
   align:middle` + the explicit gap keep the avatar centred next to
   the name. `decoding="async"` + `loading="lazy"` (set inline on the
   img tag) keep the settings panel snappy even with many avatars. */
.backer.has-avatar{
  display:inline-flex;
  align-items:center;
  gap:0.4em;
}
.backer-avatar{
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
  box-shadow:0 0 0 1px var(--border), 0 1px 2px var(--shadow);
  background:#222;
  /* hint to the browser: same-URL re-uses cache cleanly across re-
     renders; no fade-in keeps the supporter chip from flashing each
     time the settings tab is reopened. */
}
.backer.tier3{font-weight:700}
.backer.tier4{font-weight:800;animation-name:backer-glow-strong}
.backer.tier5{font-weight:900;animation-name:backer-glow-strong}
/* Stagger the hue-cycle phase per chip so neighbouring names show
   different colours at the same moment — coprime nth-child divisors
   yield a pseudo-random ripple. */
.backer:nth-child(2n){animation-delay:-1s}
.backer:nth-child(3n){animation-delay:-2s}
.backer:nth-child(5n){animation-delay:-3s;animation-duration:7s}
.backer:nth-child(7n){animation-delay:-4s}
@keyframes backer-glow {
  0%   { text-shadow: 0 0 3px rgba(255,107,107,0.95),  0 0 8px rgba(255,107,107,0.55) }
  16%  { text-shadow: 0 0 3px var(--warn-line),  0 0 8px var(--warn-line) }
  33%  { text-shadow: 0 0 3px var(--warn-line), 0 0 8px var(--warn-line) }
  50%  { text-shadow: 0 0 3px var(--success-line),  0 0 8px var(--success-line) }
  66%  { text-shadow: 0 0 3px var(--accent-line),  0 0 8px var(--accent-line) }
  83%  { text-shadow: 0 0 3px rgba(155,89,182,0.95),  0 0 8px rgba(155,89,182,0.55) }
  100% { text-shadow: 0 0 3px rgba(255,107,107,0.95),  0 0 8px rgba(255,107,107,0.55) }
}
@keyframes backer-glow-strong {
  0%   { text-shadow: 0 0 4px rgba(255,107,107,1),    0 0 12px rgba(255,107,107,0.7), 0 0 20px rgba(255,107,107,0.35) }
  16%  { text-shadow: 0 0 4px rgba(245,166,35,1),    0 0 12px var(--warn-line),  0 0 20px var(--warn-line) }
  33%  { text-shadow: 0 0 4px rgba(245,215,110,1),   0 0 12px var(--warn-line), 0 0 20px var(--warn-line) }
  50%  { text-shadow: 0 0 4px rgba(46,204,113,1),    0 0 12px var(--success-line),  0 0 20px var(--success-line) }
  66%  { text-shadow: 0 0 4px rgba(93,173,226,1),    0 0 12px var(--accent-line),  0 0 20px var(--accent-line) }
  83%  { text-shadow: 0 0 4px rgba(155,89,182,1),    0 0 12px rgba(155,89,182,0.7),  0 0 20px rgba(155,89,182,0.35) }
  100% { text-shadow: 0 0 4px rgba(255,107,107,1),    0 0 12px rgba(255,107,107,0.7), 0 0 20px rgba(255,107,107,0.35) }
}
.backers-extra{
  font-size:10px;color:var(--text-dim);font-style:italic;
  margin:5px 0 0 !important;
  line-height:1.4;
}

/* Important-notes tab: stepped instructions with screenshots */
.step{margin:12px 0 16px;padding:12px 14px;background:var(--tint);border-radius:6px;border-left:3px solid var(--accent)}
.step-title{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:6px}
.step p{margin-bottom:6px;font-size:12px;color:var(--text)}
.step img{display:block;max-width:100%;height:auto;border-radius:4px;margin:6px 0;box-shadow:0 2px 6px var(--shadow);background:var(--bg-card)}
.tip-line{font-size:11.5px;color:var(--text-dim);margin-top:6px}
.benefit-list{padding-left:18px;margin:8px 0 12px}
.benefit-list li{margin-bottom:4px;color:var(--text);font-size:12px}
.benefit-tag{display:inline-block;font-size:10px;background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:4px;margin-right:6px}

.role-notice{font-size:10.5px;color:var(--text-dim);font-style:italic}

/* Settings download button — used by the character-card tab to expose
   the xlsx template directly inside Settings (saves the user from
   hunting for it inside the cc panel side-rail). */
.dl-btn{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:10px;
  padding:8px 14px;
  background:linear-gradient(180deg, var(--success-soft), var(--success-soft));
  border:1px solid var(--success-line);
  border-radius:6px;
  color:var(--success);font-size:12.5px;font-weight:700;
  text-decoration:none;
  letter-spacing:0.3px;
  cursor:pointer;
  transition:background .12s, color .12s, border-color .12s;
}
.dl-btn:hover{
  background:linear-gradient(180deg, var(--success-soft), var(--success-line));
  color:var(--success);
}
.dl-btn:active{transform:scale(0.98)}
.dl-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dl-row .dl-btn{margin-top:0}

/* === 基础设置 — block layout for grouped sub-settings === */
.basics-block{display:flex;flex-direction:column;gap:4px}
.basics-h{
  font-size:11px;font-weight:700;color:var(--text);
  letter-spacing:0.4px;
  text-transform:uppercase;
  margin-bottom:2px;
}
.basics-toggle{
  display:flex;align-items:center;gap:8px;
  cursor:pointer;
  font-size:12px;color:var(--text);
  user-select:none;
}
.basics-toggle input{
  width:14px;height:14px;cursor:pointer;
  accent-color:var(--accent);
}

/* Shared destructive-action button. Despite the name it's used by
   THREE buttons: the panel-layout reset (基础设置 → 面板布局), the
   bubbles legacy-hide repair (血条), and the bestiary legacy-image
   repair (怪物图鉴). Solid red to signal a mutating one-shot action;
   compact, fits next to the description text. Restyle with care —
   changes hit all three. */
.reset-panels-btn{
  align-self:flex-start;
  height:28px;
  padding:0 14px;
  background:var(--danger-line);
  border:1px solid var(--danger-line);
  border-radius:6px;
  color:#fff;
  font-family:inherit;font-size:11.5px;font-weight:600;
  cursor:pointer;
  transition:filter 0.12s, border-color 0.12s;
}
.reset-panels-btn:hover{filter:brightness(1.12);border-color:var(--danger)}
.reset-panels-btn:active{filter:brightness(0.92)}

/* Open-the-layout-editor button. Sits next to the reset button in
   the same row. Blue to distinguish from the destructive red reset. */
.layout-editor-btn{
  align-self:flex-start;
  height:28px;
  padding:0 14px;
  background:var(--accent-line);
  border:1px solid var(--accent-line);
  border-radius:6px;
  color:#fff;
  font-family:inherit;font-size:11.5px;font-weight:600;
  cursor:pointer;
  transition:filter 0.12s, border-color 0.12s;
}
.layout-editor-btn:hover{filter:brightness(1.12);border-color:var(--accent)}
.layout-editor-btn:active{filter:brightness(0.92)}

/* === 库设置 === */
.lib-warn{
  background:var(--warn-soft);
  border:1px solid var(--warn-line);
  border-radius:6px;
  padding:8px 12px;
  font-size:11.5px;color:var(--warn);
  line-height:1.55;
  margin-bottom:12px;
}
.lib-warn code{
  background:var(--bg-strong);
  padding:1px 5px;border-radius:3px;
  font-size:10.5px;
}
/* Monster Studio promo row — visual editor alternative to hand-writing
   library JSON. Links out to the standalone studio web tool. */
.lib-studio{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--accent-soft);
  border:1px solid var(--accent-line);
  border-radius:6px;
  padding:8px 12px;
  font-size:11.5px;color:var(--text-dim);
  line-height:1.55;
  margin-bottom:12px;
}
.lib-studio-txt{flex:1;min-width:180px}
.lib-studio-txt b{color:var(--accent)}
.lib-studio-btn{
  flex-shrink:0;
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;
  background:var(--accent-soft);
  border:1px solid var(--accent-line);
  color:var(--accent);font-weight:700;
  border-radius:6px;font-size:11.5px;
  text-decoration:none;
  transition:background .12s;
}
.lib-studio-btn:hover{background:var(--accent-line)}
.lib-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.lib-row{
  display:flex;flex-direction:column;gap:6px;
  background:var(--tint);
  border:1px solid var(--border);
  border-radius:6px;
  padding:8px 10px;
}
.lib-row-head{display:flex;align-items:center;gap:8px}
.lib-row-head .lib-name{
  flex:1;min-width:0;
  background:var(--bg-strong);
  border:1px solid var(--border);
  color:var(--text);font-size:12px;
  padding:5px 8px;border-radius:4px;
  font-family:inherit;
}
.lib-row-head .lib-name:read-only{opacity:0.7}
.lib-row-url{display:flex;align-items:center;gap:6px}
.lib-row-url .lib-row-label{
  flex-shrink:0;
  font-size:10.5px;color:var(--text-dim);font-weight:700;
  font-family:ui-monospace,Consolas,monospace;
}
.lib-url{
  flex:1;min-width:0;
  background:var(--bg-strong);
  border:1px solid var(--border);
  color:var(--text);font-size:11px;
  padding:4px 8px;border-radius:4px;
  font-family:ui-monospace,Consolas,monospace;
}
.lib-url:read-only{opacity:0.7}
.lib-row-language{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11px;color:var(--text-dim)}
.lib-row-language select{min-width:0;max-width:100%;padding:3px 6px;background:var(--bg-strong);color:var(--text);border:1px solid var(--border);border-radius:4px;font:inherit}
.lib-language-status{font-size:10px;color:var(--accent-warm)}
.lib-tag{
  font-size:9px;font-weight:700;
  color:var(--success);background:var(--success-soft);
  padding:2px 6px;border-radius:3px;letter-spacing:0.4px;
}
.lib-del-btn{
  flex-shrink:0;width:24px;height:24px;
  background:var(--danger-soft);
  border:1px solid var(--danger-line);
  color:var(--danger);
  border-radius:4px;font-size:12px;cursor:pointer;
  font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .12s;
}
.lib-del-btn:hover:not(:disabled){background:var(--danger-line)}
.lib-del-btn:disabled{opacity:0.45;cursor:not-allowed}
.lib-actions{margin-bottom:14px}
.lib-add-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;
  background:var(--accent-soft);
  border:1px solid var(--accent-line);
  color:var(--accent);font-weight:700;
  border-radius:6px;font-size:11.5px;
  cursor:pointer;font-family:inherit;
  transition:background .12s;
}
.lib-add-btn:hover{background:var(--accent-line)}
.lib-add-en-btn{
  display:inline-flex;align-items:center;gap:6px;
  margin-left:8px;
  padding:6px 14px;
  background:var(--success-soft);
  border:1px solid var(--success-line);
  color:var(--success);font-weight:700;
  border-radius:6px;font-size:11.5px;
  cursor:pointer;font-family:inherit;
  transition:background .12s;
}
.lib-add-en-btn:hover{background:var(--success-soft)}

/* Preview button + diagnostic panel inside each library row */
.lib-preview-btn{
  flex-shrink:0;
  padding:5px 10px;
  background:rgba(155,89,182,0.18);
  border:1px solid rgba(155,89,182,0.40);
  color:#cda9e8;font-weight:700;
  border-radius:4px;font-size:11px;
  cursor:pointer;font-family:inherit;
  white-space:nowrap;
  transition:background .12s;
}
.lib-preview-btn:hover:not(:disabled){background:rgba(155,89,182,0.30)}
.lib-preview-btn:disabled{opacity:0.55;cursor:wait}
/* Per-source picker (📚 来源) — same visual family as the preview
   button but in a teal palette to distinguish "manage" from "probe". */
.lib-sources-btn{
  flex-shrink:0;
  padding:5px 10px;
  background:rgba(46,166,165,0.18);
  border:1px solid rgba(46,166,165,0.40);
  color:#9ed4d3;font-weight:700;
  border-radius:4px;font-size:11px;
  cursor:pointer;font-family:inherit;
  white-space:nowrap;
  transition:background .12s;
}
.lib-sources-btn:hover:not(:disabled){background:rgba(46,166,165,0.30)}
.lib-sources-btn:disabled{opacity:0.55;cursor:not-allowed}
.lib-sources{
  margin-top:8px;
  padding:10px 12px;
  background:var(--bg-strong);
  border:1px solid var(--border);
  border-radius:5px;
  font-size:11.5px;
}
.lib-sources-loading,.lib-sources-empty,.lib-sources-err{
  color:var(--text-dim);font-style:italic;
}
.lib-sources-err{color:var(--danger);font-style:normal}
.lib-sources-head{
  color:var(--text);font-size:11px;
  margin-bottom:8px;line-height:1.45;
}
.lib-sources-list{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(165px, 1fr));
  gap:4px 10px;
}
.lib-source-row{
  display:flex;align-items:center;gap:6px;
  padding:3px 4px;
  border-radius:3px;
  cursor:pointer;
  transition:background .1s;
}
.lib-source-row:hover{background:var(--tint)}
.lib-source-cb{margin:0;cursor:pointer;flex-shrink:0}
.lib-source-cb:disabled{cursor:not-allowed}
.lib-source-code{
  flex:1;
  font-family:'Menlo','Consolas',monospace;
  font-size:10.5px;letter-spacing:0.2px;
  color:var(--text);
  overflow:hidden;text-overflow:ellipsis;
}
.lib-source-count{
  color:var(--text-dim);font-size:10px;
  font-variant-numeric:tabular-nums;
  flex-shrink:0;
}
.lib-preview{
  margin-top:8px;
  padding:10px 12px;
  background:var(--bg-strong);
  border:1px solid var(--border);
  border-radius:5px;
  font-size:11.5px;
}
.lib-preview-status{
  font-weight:700;font-size:12px;
  word-break:break-all;
  display:block;
}
.lib-preview-status.ok{color:var(--success)}
.lib-preview-status.fail{color:var(--danger)}
.lib-preview-count{color:var(--text-dim);font-weight:500;font-size:11px;margin-left:6px}
.lib-preview-section{margin-top:10px}
.lib-preview-h{
  font-weight:800;color:var(--text);
  font-size:11px;text-transform:uppercase;letter-spacing:0.4px;
  margin-bottom:4px;
}
.lib-preview-srcmap{
  display:flex;flex-wrap:wrap;gap:4px;
}
.lib-preview-srcmap code{
  background:var(--tint);
  border:1px solid var(--border);
  border-radius:3px;
  padding:1px 6px;
  font-size:10.5px;
}
.lib-preview-tbl{
  width:100%;border-collapse:collapse;font-size:10.5px;
}
.lib-preview-tbl thead th{
  text-align:left;
  background:var(--tint);
  padding:3px 5px;
  border-bottom:1px solid var(--border);
  font-weight:700;color:var(--text-dim);
}
.lib-preview-tbl tbody td{
  padding:3px 5px;
  border-bottom:1px solid var(--tint);
  vertical-align:top;
}
.lib-preview-tbl tbody tr:hover td{background:var(--tint)}
.lib-preview-tbl code{
  background:var(--tint);
  border-radius:2px;padding:0 4px;font-size:10px;
}
.lib-preview-probe{
  display:flex;flex-direction:column;gap:1px;
  padding:5px 7px;
  border-radius:4px;
  margin-bottom:3px;
  font-size:10.5px;
}
.lib-preview-probe.ok{background:var(--success-soft);border:1px solid var(--success-soft)}
.lib-preview-probe.fail{background:var(--danger-soft);border:1px solid var(--danger-line)}
.lib-preview-probe-label{font-weight:700;color:var(--text)}
.lib-preview-probe.ok .lib-preview-probe-label{color:var(--success)}
.lib-preview-probe.fail .lib-preview-probe-label{color:var(--danger)}
.lib-preview-probe-url{color:var(--text-dim);font-family:ui-monospace,Consolas,monospace;font-size:10px;word-break:break-all}
.lib-preview-probe-status{color:var(--text);font-size:10.5px}
.lib-preview-err{
  background:var(--danger-soft);
  border:1px solid var(--danger-line);
  border-radius:4px;
  padding:8px 10px;
  color:var(--danger);font-size:11px;
  white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,Consolas,monospace;
  margin-top:6px;
}
.lib-preview-hint{
  margin-top:10px;color:var(--text-dim);font-size:11px;line-height:1.6;
}
.lib-preview-empty{color:var(--text-dim);font-style:italic;font-size:11px;margin:4px 0}

/* Local content block — sits between URL libraries and the tutorial */
.lib-local{
  margin:14px 0;
  padding:10px 12px;
  background:var(--success-soft);
  border:1px solid var(--success-soft);
  border-radius:6px;
}
.lib-local-h{
  margin:0 0 4px;
  font-size:13px;color:var(--success);
  font-weight:800;
}
.lib-local-desc{
  margin:0 0 8px;font-size:11.5px;line-height:1.6;color:var(--text-dim);
}
.lib-local-actions{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;
}
.lib-local-actions button{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;
  background:var(--success-soft);
  border:1px solid var(--success-line);
  color:var(--success);font-weight:700;
  border-radius:6px;font-size:11.5px;
  cursor:pointer;font-family:inherit;
  transition:background .12s;
}
.lib-local-actions button:hover{background:var(--success-line)}
.lib-local-list{
  display:flex;flex-direction:column;gap:4px;
}
.lib-local-empty{
  margin:4px 0;color:var(--text-dim);font-size:11px;font-style:italic;
}
.lib-local-row{
  display:flex;align-items:center;gap:8px;
  padding:5px 8px;
  background:var(--bg-strong);
  border:1px solid var(--tint);
  border-radius:4px;
  font-size:11.5px;
}
.lib-local-name{
  flex:1;min-width:0;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:ui-monospace,Consolas,monospace;
}
.lib-local-meta{
  flex-shrink:0;color:var(--text-dim);font-size:10.5px;
}
.lib-local-del{
  flex-shrink:0;
  width:22px;height:22px;
  background:var(--danger-soft);
  border:1px solid var(--danger-line);
  color:var(--danger);
  border-radius:4px;font-size:11px;cursor:pointer;
  font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .12s;
}
.lib-local-del:hover:not(:disabled){background:var(--danger-line)}
.lib-local-del:disabled{opacity:0.45;cursor:not-allowed}

/* Tutorial collapsible */
.lib-tut{
  background:var(--bg-strong);
  border:1px solid var(--tint);
  border-radius:6px;
  padding:6px 10px;
  font-size:12px;
}
.lib-tut > summary{
  cursor:pointer;
  font-weight:700;color:var(--text);
  padding:4px 0;
  list-style:none;
  user-select:none;
}
.lib-tut > summary::before{
  content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);
  display:inline-block;
  margin-right:6px;
  font-size:10px;color:var(--accent);
  transition:transform .15s;
}
.lib-tut[open] > summary::before{transform:rotate(90deg)}
.lib-tut-body{padding:6px 0 4px}
.lib-tut-body h4{
  font-size:12px;color:var(--warn);font-weight:700;
  margin:10px 0 4px;padding-bottom:2px;
  border-bottom:1px solid var(--warn-soft);
}
.lib-tut-body p{margin:4px 0;line-height:1.6;color:var(--text)}
.lib-tut-body pre{
  background:var(--bg-strong);
  border:1px solid var(--tint);
  border-radius:4px;
  padding:8px 10px;margin:6px 0;
  overflow-x:auto;
  font-size:10.5px;line-height:1.5;
  color:var(--text);
  font-family:ui-monospace,Consolas,monospace;
}
.lib-tut-body code{
  background:var(--bg-strong);
  padding:1px 5px;border-radius:3px;
  font-size:10.5px;color:var(--accent);
}
.lib-tut-body ol, .lib-tut-body ul{margin:4px 0 4px 22px;color:var(--text)}
.lib-tut-body li{margin-bottom:3px;line-height:1.55}
.lib-prompt{
  width:100%;
  height:140px;
  resize:vertical;
  background:var(--bg-strong);
  border:1px solid var(--border);
  border-radius:4px;
  padding:8px 10px;
  font-size:10.5px;line-height:1.55;
  color:var(--text);
  font-family:ui-monospace,Consolas,monospace;
  margin:6px 0;
}
.lib-prompt-copy{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 12px;
  background:var(--success-soft);
  border:1px solid var(--success-line);
  color:var(--success);font-weight:700;
  border-radius:5px;font-size:11px;
  cursor:pointer;font-family:inherit;
  transition:background .12s;
}
.lib-prompt-copy:hover{background:var(--success-line)}
/* Narrow popovers and phones: a slimmer tab rail, no horizontal overflow. */
@media(max-width:560px){.tabs{width:108px;min-width:96px}.tab{font-size:11px;padding:8px 8px}.content{padding:10px}.head{padding:9px 10px}}
</style>
</head>

  <div class="head">
    <h1 id="title">设置</h1>
    <div class="lang-switch">
      <button id="langZh" class="on" type="button">CN</button>
      <button id="langEn" type="button">EN</button>
    </div>
  </div>
  <div class="main">
    <nav class="tabs" id="tabs"></nav>
    <article class="content-wrap">
      <div class="top-bar" id="topBar"></div>
      <div class="content" id="content"></div>
    </article>
  </div>
<script type="module" src="/src/settings.ts"></script>
</body>
</html>
