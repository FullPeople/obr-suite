name: Multiplayer synchronization regression
on:
  push:
    branches: [dev, main, 'codex/multiplayer*', 'codex/sdk-rate*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multiplayer-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synchronization:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - run: npm ci
      - name: Check host types
        run: npx tsc --noEmit
      - name: Actual music UI and viewport SDK rate recovery
        run: node --test tools/sdk-rate-recovery289.test.mjs
      - name: Music authority, handoff and movement-only party updates
        run: node src/modules/musicBoard/selftest.mjs
      - name: Retain the 256 MiB Relay memory limit
        if: ${{ hashFiles('tools/relay-memory-selftest.mjs') != '' }}
        run: node tools/relay-memory-selftest.mjs
      - name: Inventory projection and operation compatibility
        run: node tools/workbench-inventory-sync-selftest.mjs
