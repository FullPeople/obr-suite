name: Verify Suite candidate
on:
  push:
    branches: [main, codex/performance-closeout-stable-20261011]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suite-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DND_CARD_WEB_ROOT: ${{ github.workspace }}/.paired-web
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact paired Web source
        uses: actions/checkout@v6
        with:
          repository: FullPeople/DND-card-web
          ref: 6f54627ecc00f9e542d41f5b1703d84c65d0811c
          path: .paired-web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - run: npm ci
      - run: npm ci
        working-directory: .paired-web
      - name: Verify pinned rule source and real consumer evidence
        working-directory: .paired-web
        run: |
          npm run verify:automation-source
          npm run verify:automation-runtime
          npm run verify:automation-progress
      - name: Build exact paired cloud and five-page viewer
        working-directory: .paired-web
        run: |
          npm run build:cloud
          node node_modules/vite/bin/vite.js build
      - name: Build stable host and its included viewer
        run: |
          node node_modules/typescript/bin/tsc
          node node_modules/vite/bin/vite.js build
          node tools/build-legacy-card-viewer.mjs --web-built
      - name: Install official Chromium
        run: npx playwright install --with-deps chromium
      - name: Stable regressions including QQ ordering and personal preferences
        run: node tools/verify-suite-candidate.mjs
      - name: Actual legacy picker binding and permission revocation
        run: node tools/character-directory259-selftest.mjs
      - name: Actual legacy QQ pages and HTTP room permissions
        run: node tools/qq-room-browser-selftest.mjs
      - name: Preserve bounded evidence and exact stable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-verification-${{ github.sha }}
          retention-days: 2
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .local-evidence/verification/
            .local-evidence/directory259/
            .local-evidence/qq-room/
            dist/
