name: Verify Suite candidate
on:
  push:
    branches: [codex/dice-mode278-20261010, codex/qq-library-entry-dev-20261010, codex/number-flight276-20261010,codex/jolt-simd274, codex/qq-account-permissions-dev-20261010, codex/excel-sync-20261010, codex/dice-research270, codex/dice-mixed269, codex/music-board267-20261010, codex/text-effects266-20261010, codex/text-effects-20261009, codex/inline-choices264, codex/dice-instant263, codex/card-ux260-dev, codex/card-ux259-dev, codex/palette-258-dev, codex/unified-ui-dev-20261008, codex/card-links-dev-20261008, codex/dice-package-repair252-20261007, codex/card-suite-followup-suite-20261007, codex/dice-tail247-20261005, codex/resource-repair246-20261005, fix/dice-safe-resources-20261004, fix/dice-small-resource-combined-20261004, codex/card-suite-combined-20261004, fix/dice-latency-recovered-20261004, fix/workbench-recovery-online-safe-20261004, fix/owner-startup-243-20261003, codex/owner-sync243-20261004, codex/owner-sync242-20261004, dev, fix/owner-sync-20261003, codex/intro-three-dragon-20261003, codex/suite-host-repair-20261001, codex/card-presentation-235, codex/merge-eight236-suite-20261003, codex/monster-card-lifecycle-20261003, codex/merge-monster237-suite-20261003, codex/import-entry273-20261010]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suite-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DND_CARD_WEB_ROOT: ${{ github.workspace }}/.paired-web
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact paired Web source
        uses: actions/checkout@v6
        with:
          repository: FullPeople/DND-card-web
          ref: 0127861795822911c150fcc76b721ebab3c260ad
          path: .paired-web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - name: Install locked Suite dependencies
        run: npm ci
      - name: Install locked paired Web dependencies
        working-directory: .paired-web
        run: npm ci
      - name: Verify pinned progress source and linked mechanism evidence
        working-directory: .paired-web
        run: |
          npm run verify:automation-source
          npm run verify:automation-runtime
          npm run verify:automation-progress
      - name: Install official Chromium
        id: browser
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {chromium} from '@playwright/test'; console.log('CHROMIUM_PATH='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Native music collection, permissions, persistence and playback lifecycle
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: ${{ env.CHROMIUM_PATH }}
        run: |
          node src/modules/musicBoard/selftest.mjs
          node src/modules/musicBoard/browser-selftest.mjs
      - name: Grid-box anchoring and cross-scene picker regression
        run: |
          npm run test:bubbles
          node tools/character-directory259-selftest.mjs
          node tools/card-sync260-selftest.mjs
          node tools/dice-mixed269-selftest.mjs
          node tools/dice-delta270-selftest.mjs
          node tools/dice-fast-tail270-selftest.mjs
          node tools/dice-physics270-selftest.mjs
          node tools/dice-render-resource-selftest.mjs
      - name: Suite regression tests
        id: tests
        run: node tools/verify-suite-candidate.mjs
      - name: Retired fog context menu
        run: FOG_MENU_EVIDENCE=.local-evidence/fog-menu node tools/fog-menu-retirement-selftest.mjs
      - name: Typecheck and build stable host with paired card viewer
        run: npm run build
      - name: Build dev host and retained historical Three Dragon fixture
        run: |
          npm run build:workbench-dev
          npm run build:three-dragon
      - name: Verify native music panel ships without the retired website panel
        run: node --input-type=module -e "import assert from 'node:assert/strict';import {existsSync} from 'node:fs';assert(existsSync('dist-workbench-dev/workbench-panels/music.html'));assert(!existsSync('dist-workbench-dev/workbench-panels/studio.html'));"
      - name: Document editing, separate monster tabs and readable camera bindings
        run: xvfb-run -a npm run test:workbench
      - name: Text presentation navigation, presets, native display and narrow layouts
        env:
          TEXT_EFFECT_PANEL_OUT: ${{ github.workspace }}/dist-workbench-dev/workbench-panels
          PLAYWRIGHT_EXECUTABLE_PATH: ${{ env.CHROMIUM_PATH }}
        run: |
          node tools/build-text-effects-fixture.mjs
          mkdir -p .local-evidence/text-effects/browser
          node node_modules/vite/bin/vite.js --config tools/text-effects-browser.vite.ts > .local-evidence/text-effects/browser/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5197/tests/fixtures/text-effects/index.html > /dev/null; then break; fi
            sleep 1
          done
          node tools/text-effects-browser-selftest.mjs
      - name: Verify legacy 2D dice, display settings and no-skin requests
        run: node tools/dice-mode278-browser.mjs
      - name: Verify built settings palette and browser persistence
        run: |
          mkdir -p .local-evidence/palette257
          cp -R dist-workbench-dev/workbench-panels .local-evidence/palette257/panels
          WORKBENCH_SETTINGS_TEST_OUT=.local-evidence/palette257 node tools/workbench-palette257-selftest.mjs
      - name: Verify exact production dice package and native readiness
        run: |
          node tools/dice-production-package-selftest.mjs
          PLAYWRIGHT_EXECUTABLE_PATH="$CHROMIUM_PATH" node tools/dice-production-readiness-browser.mjs
      - name: Verify small-roll transport with actual SDK, Jolt and visible WebGL pixels
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: ${{ env.CHROMIUM_PATH }}
          DICE_LATENCY_SOFTWARE: '1'
          DICE_LATENCY_SEPARATE_WINDOWS: '1'
          DICE_LATENCY_PIXELS: '1'
          DICE_LATENCY_VIDEO: '0'
          DICE_LATENCY_SCREENSHOTS: '0'
          DICE_COMBINED_SMOKE: '1'
        run: |
          node tools/dice-latency-build.mjs
          node tools/dice-latency-browser.mjs
      - name: Verify all die families and real numeric flight without a target
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: ${{ env.CHROMIUM_PATH }}
          DICE_LATENCY_SOFTWARE: '1'
          DICE_LATENCY_SEPARATE_WINDOWS: '1'
          DICE_LATENCY_PIXELS: '1'
          DICE_LATENCY_VIDEO: '0'
          DICE_LATENCY_SCREENSHOTS: '0'
          DICE_LATENCY_MIXED: '1'
          DICE_CUE_STALLS: '1'
          DND_DICE_EVIDENCE: .local-evidence/dice-mixed269/browser
        run: node tools/dice-latency-browser.mjs
      - name: Retained numeric cue pixels and bounded frame recovery
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: ${{ env.CHROMIUM_PATH }}
        run: node tools/dice-cue276-browser.mjs
      - name: Verify public-link source archive is reproducible
        shell: bash
        run: |
          set -euo pipefail
          for source in tools/three-dragon-website-entry.html tools/build-workbench-panels.mjs tools/build-three-dragon-overlay.mjs three-dragon-ante.html vite.config.ts; do
            tar -xOf dist-workbench-dev/workbench/suite-source.zip "$source" | cmp - "$source"
          done
      - name: Verify final public website links and retired-game negative controls
        run: node tools/three-dragon-website-entry-selftest.mjs --built
      - name: Public website links wide and narrow browser regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tools/three-dragon-website-entry-browser.mjs
      - name: Historical Three Dragon layout and exit fixture regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tools/three-dragon-seat-exit-browser.mjs
      - name: Announcement DOM regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tools/announcement-scope-browser.mjs
      - name: Action launcher DOM regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tools/action-launcher-layout-browser.mjs
      - name: Cold player SDK browser regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: WEB_ROOT="$DND_CARD_WEB_ROOT" PLAYWRIGHT_EXECUTABLE_PATH="$CHROMIUM_PATH" PROFILE_OUT=.local-evidence/owner-cold-browser EXPECT_PASS=1 node tools/workbench-owner-cold-sdk-selftest.mjs
      - name: Permission guide browser and wide/narrow screenshots
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tools/permission-notice-browser-selftest.mjs
      - name: Preserve bounded synthetic-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-verification-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .local-evidence/music-board/
            .local-evidence/palette257/results.json
            .local-evidence/palette257/settings-palette.png
            .local-evidence/three-dragon-website-entry/
            .local-evidence/three-dragon-website-browser/
            .local-evidence/three-dragon-seat-exit/
            .local-evidence/owner-cold-browser/
            .local-evidence/verification/owner-cold-sdk/vm-results.json
            .local-evidence/permission-notice/
            .local-evidence/verification/*.log
            .local-evidence/verification/results.json
            .local-evidence/dice-mode278/
            .local-evidence/cue276/result.json
            .local-evidence/cue276-unit/result.json
            .local-evidence/dice-mixed269/browser/result.json
            .local-evidence/dice-mixed269/browser/failure.json
            .local-evidence/text-effects/browser/
            .local-evidence/native-owner/results.json
            .local-evidence/production-dice/package/result.json
            .local-evidence/production-dice/browser/
            .local-evidence/announcement-scope/*.png
            .local-evidence/announcement-scope/*.zip
            .local-evidence/announcement-scope/results.json
            .local-evidence/action-layout/*.png
            .local-evidence/action-layout/*.zip
            .local-evidence/action-layout/results.json
            .local-evidence/permission-notice/*.png
            .local-evidence/permission-notice/results.json
      - name: Preserve compact visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-visual-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .local-evidence/three-dragon-website-entry/
            .local-evidence/three-dragon-website-browser/
            .local-evidence/three-dragon-seat-exit/*.png
            .local-evidence/three-dragon-seat-exit/*.json
            .local-evidence/announcement-scope/*.png
            .local-evidence/announcement-scope/results.json
            .local-evidence/action-layout/*.png
            .local-evidence/action-layout/results.json
            .local-evidence/permission-notice/*.png
            .local-evidence/permission-notice/results.json
      - name: Preserve exact paired production build for the progress release
        uses: actions/upload-artifact@v4
        with:
          name: verified-suite-dev-production-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist-workbench-dev/
