name: Verify Suite candidate
on:
  push:
    branches: [codex/owner-sync243-20261004, codex/owner-sync242-20261004, dev, fix/owner-sync-20261003, codex/intro-three-dragon-20261003, codex/suite-host-repair-20261001, codex/card-presentation-235, codex/merge-eight236-suite-20261003, codex/monster-card-lifecycle-20261003, codex/merge-monster237-suite-20261003]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suite-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DND_CARD_WEB_ROOT: ${{ github.workspace }}/.paired-web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out exact paired Web source
        uses: actions/checkout@v6
        with:
          repository: FullPeople/DND-card-web
          ref: fbccf5725e93e605b016858d3f45d35bddb27f08
          path: .paired-web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked Suite dependencies
        run: npm ci
      - name: Install locked paired Web dependencies
        working-directory: .paired-web
        run: npm ci
      - name: Install official Chromium
        id: browser
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {chromium} from '@playwright/test'; console.log('CHROMIUM_PATH='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Suite regression tests
        id: tests
        run: node tools/verify-suite-candidate.mjs
      - name: Typecheck and build stable host with paired card viewer
        run: npm run build
      - name: Build dev host and shared Three Dragon
        run: |
          SUITE_BASE=suite-dev SUITE_CHANNEL=dev npx vite build --outDir dist-workbench-dev
          npm run build:three-dragon
          cp -R "$DND_CARD_WEB_ROOT/dist" dist-workbench-dev/workbench
          node tools/build-workbench-dice.mjs
          node tools/build-workbench-panels.mjs
          node tools/build-legacy-card-viewer.mjs --web-built --out-dir dist-workbench-dev
      - name: Three Dragon layout and exit browser regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tools/three-dragon-seat-exit-browser.mjs
      - name: Announcement DOM regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tools/announcement-scope-browser.mjs
      - name: Action launcher DOM regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tools/action-launcher-layout-browser.mjs
      - name: Cold player SDK browser regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: WEB_ROOT="$DND_CARD_WEB_ROOT" PLAYWRIGHT_EXECUTABLE_PATH="$CHROMIUM_PATH" PROFILE_OUT=.local-evidence/owner-cold-browser EXPECT_PASS=1 node tools/workbench-owner-cold-sdk-selftest.mjs
      - name: Permission guide browser and wide/narrow screenshots
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tools/permission-notice-browser-selftest.mjs
      - name: Preserve bounded synthetic-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-verification-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .local-evidence/three-dragon-seat-exit/
            .local-evidence/owner-cold-browser/
            .local-evidence/verification/owner-cold-sdk/vm-results.json
            .local-evidence/permission-notice/
            .local-evidence/verification/*.log
            .local-evidence/verification/results.json
            .local-evidence/native-owner/results.json
            .local-evidence/announcement-scope/*.png
            .local-evidence/announcement-scope/*.zip
            .local-evidence/announcement-scope/results.json
            .local-evidence/action-layout/*.png
            .local-evidence/action-layout/*.zip
            .local-evidence/action-layout/results.json
            .local-evidence/permission-notice/*.png
            .local-evidence/permission-notice/results.json
      - name: Preserve compact visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-visual-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .local-evidence/three-dragon-seat-exit/*.png
            .local-evidence/three-dragon-seat-exit/*.json
            .local-evidence/announcement-scope/*.png
            .local-evidence/announcement-scope/results.json
            .local-evidence/action-layout/*.png
            .local-evidence/action-layout/results.json
            .local-evidence/permission-notice/*.png
            .local-evidence/permission-notice/results.json
