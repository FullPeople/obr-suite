name: Verify small dice resource candidate
on:
  push:
    branches: [fix/dice-small-resource-combined-20261004]
permissions:
  contents: read
concurrency:
  group: dice-small-resource-${{ github.ref }}
  cancel-in-progress: false
env:
  DND_CARD_WEB_ROOT: ${{ github.workspace }}/.paired-web
  BASELINE_REF: 308a7ccf0cb70794055ac75170bf112a36989993
  DICE_LATENCY_SOFTWARE: '1'
  DICE_LATENCY_SMALL: '1'
jobs:
  paired_timing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone-portrait
            width: 390
            height: 844
            dpr: 3
            theme: ink_sketch
          - name: phone-landscape
            width: 844
            height: 390
            dpr: 2
            theme: royal_ember_resin
          - name: tablet-portrait
            width: 768
            height: 1024
            dpr: 1.5
            theme: godot_blue_cat_eye
    env:
      DICE_LATENCY_CORE: '1'
      DICE_LATENCY_VIDEO: '0'
      DICE_LATENCY_SCREENSHOTS: '0'
      DICE_LATENCY_PIXELS: '0'
      DICE_LATENCY_WIDTH: ${{ matrix.width }}
      DICE_LATENCY_HEIGHT: ${{ matrix.height }}
      DICE_LATENCY_DPR: ${{ matrix.dpr }}
      DICE_LATENCY_THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: FullPeople/DND-card-web
          ref: fb584043c6bed831b9ca92eab783653770c24fe6
          path: .paired-web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare identical diagnostic harness at immutable baseline
        run: |
          test "$(git rev-parse "$BASELINE_REF^{commit}")" = "$BASELINE_REF"
          git worktree add --detach .baseline "$BASELINE_REF"
          cp tools/dice-latency-{build,browser}.mjs .baseline/tools/
          npm ci
          npm --prefix .paired-web ci
          npm --prefix .baseline ci
          npx playwright install --with-deps chromium
      - name: Build both sources with the same paired Web
        run: |
          node tools/dice-latency-build.mjs
          (cd .baseline && node tools/dice-latency-build.mjs)
      - name: Same-runner baseline, candidate, baseline without capture or readback
        run: |
          export DND_DICE_EVIDENCE="$GITHUB_WORKSPACE/.local-evidence/small-paired/baseline-before"
          (cd .baseline && node tools/dice-latency-browser.mjs)
          export DND_DICE_EVIDENCE="$GITHUB_WORKSPACE/.local-evidence/small-paired/candidate"
          node tools/dice-latency-browser.mjs
          export DND_DICE_EVIDENCE="$GITHUB_WORKSPACE/.local-evidence/small-paired/baseline-after"
          (cd .baseline && node tools/dice-latency-browser.mjs)
          node tools/dice-small-profile-summary.mjs .local-evidence/small-paired
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dice-small-timing-${{ matrix.name }}-${{ github.sha }}
          path: .local-evidence/small-paired/
          include-hidden-files: true
          retention-days: 7
  captured_behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DICE_LATENCY_VIDEO: '1'
      DICE_LATENCY_SCREENSHOTS: '1'
      DICE_LATENCY_PIXELS: '1'
      DICE_LATENCY_RECOVERY: '1'
      DICE_LATENCY_WIDTH: '390'
      DICE_LATENCY_HEIGHT: '844'
      DICE_LATENCY_DPR: '3'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: FullPeople/DND-card-web
          ref: fb584043c6bed831b9ca92eab783653770c24fe6
          path: .paired-web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies and official browser
        run: |
          npm ci
          npm --prefix .paired-web ci
          npx playwright install --with-deps chromium
      - name: Capture complete animations, genuine visible pixels, privacy and recovery
        run: |
          node tools/dice-latency-build.mjs
          node tools/dice-latency-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dice-small-captured-metrics-${{ github.sha }}
          path: |
            .local-evidence/dice-latency/browser/*.json
            .local-evidence/dice-latency/browser/*.png
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dice-small-captured-video-${{ github.sha }}
          path: .local-evidence/dice-latency/browser/video/
          include-hidden-files: true
          retention-days: 7
  pixels_and_viewports:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: FullPeople/DND-card-web
          ref: fb584043c6bed831b9ca92eab783653770c24fe6
          path: .paired-web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact baseline and common probes
        run: |
          test "$(git rev-parse "$BASELINE_REF^{commit}")" = "$BASELINE_REF"
          git worktree add --detach .baseline "$BASELINE_REF"
          cp tools/dice-latency-{build,browser}.mjs tools/dice-small-preservation-build.mjs .baseline/tools/
          npm ci
          npm --prefix .paired-web ci
          npm --prefix .baseline ci
          npx playwright install --with-deps chromium
      - name: Build both texture and preview paths
        run: |
          node tools/dice-small-preservation-build.mjs
          (cd .baseline && node tools/dice-small-preservation-build.mjs)
      - name: Exact all-theme texture pixels, real clamp/depth and preview recovery
        run: node tools/dice-small-preservation-browser.mjs
      - name: Phone and tablet geometry, totals, labels and live rotation
        if: ${{ !cancelled() }}
        env:
          DICE_VIEWPORT_COMPACT: '1'
        run: node tools/dice-small-viewport-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dice-small-pixels-viewports-${{ github.sha }}
          path: |
            .local-evidence/dice-small-preservation/
            .local-evidence/dice-small-viewport-browser/
          include-hidden-files: true
          retention-days: 7
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DICE_IDLE_SOFTWARE: '1'
      DICE_IDLE_ROUNDS: '21'
      DICE_IDLE_CYCLES: '2'
      DICE_IDLE_WAIT_MS: '1000'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: FullPeople/DND-card-web
          ref: fb584043c6bed831b9ca92eab783653770c24fe6
          path: .paired-web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies and official browser
        run: |
          npm ci
          npm --prefix .paired-web ci
          npx playwright install --with-deps chromium
      - name: Validate probe contracts and build real-engine observation fixture
        run: |
          node --test tools/dice-idle-probe-contract.test.mjs
          node tools/dice-idle-lifecycle-build.mjs
      - name: Repeated small rolls, real context pause, post-pause audio, idle and teardown
        run: node tools/dice-idle-lifecycle-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dice-small-lifecycle-${{ github.sha }}
          path: .local-evidence/dice-idle/
          include-hidden-files: true
          retention-days: 7
