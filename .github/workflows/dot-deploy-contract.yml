name: Validate dot deploy contract
on:
  push:
    branches: [codex/dot-deploy-preflight-20261006, codex/dot-deploy-default-registration-20261006]
    paths: ['tools/dot-deploy/**', '.github/workflows/dot-deploy*.yml']
  pull_request:
    paths: ['tools/dot-deploy/**', '.github/workflows/dot-deploy*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the fixed entry point without server credentials
        working-directory: tools/dot-deploy
        run: python3 -B -m unittest -v test_preflight
