<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Full Suite · DM 公告</title>
<style>
:root {
  --bg: var(--suite-bg,#292d3c);
  --bg-soft: var(--bg);
  --bg-strong: var(--suite-bg-strong,#1f2230);
  --bg-card:var(--suite-bg-card,#323748);
  --border:var(--suite-border,rgba(255,255,255,0.24));
  --border-strong:var(--suite-border-strong,rgba(255,255,255,0.36));
  --accent:var(--suite-accent,#5dade2);
  --accent-dim:var(--accent);
  --warn:var(--suite-warn,#f5a623);
  --warn-dim: var(--warn);
  --text:var(--suite-text,#e6e8ee);
  --text-dim:var(--suite-text-dim,#aab0c2);
  --text-mute:var(--text-dim);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%; width: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
  font-size: 13px;
  background: transparent;
  color: var(--text);
  overflow: hidden;
}
body {
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.card {
  width: 100%;
  height: 100%;
  background: var(--bg-soft);
  border: 1px solid var(--border-strong);
  border-radius: 0;
  box-shadow: none;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-strong);
}
.auto-progress{
  height:4px;
  width:100%;
  background:var(--tint);
  overflow:hidden;
  display:none;
}
.auto-progress.on{display:block}
.auto-progress .bar{
  width:100%;
  height:100%;
  background:var(--text-dim);
  transform-origin:left center;
  /* Counts the 3 s the close button stays disabled. Kept in sync with
     READ_GATE_MS in src/dm-announcement.ts — change both together. */
  animation:ann-progress 3s linear forwards;
}
.auto-progress.paused .bar{animation-play-state:paused}
@keyframes ann-progress{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.head .icon {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  border-radius: 50%;
  color: var(--accent);
  flex-shrink: 0;
  --icon: 18px;
}
.head .title {
  font-size: 14.5px; font-weight: 700;
  color: var(--text);
  letter-spacing: 0.3px;
}
.head .sub {
  font-size: 11px; font-weight: 600;
  color: var(--text-dim);
  margin-top: 2px;
}
.head .spacer { flex: 1; }
/* Independent CN|EN toggle — same visual as Settings' lang-switch but
   only filters this announcement modal (per-client localStorage,
   doesn't touch the suite-wide language). */
.lang-switch{
  display:flex;background:var(--bg-strong);border:1px solid var(--border);
  border-radius:5px;overflow:hidden;
  flex-shrink:0;
}
.lang-switch button{
  background:transparent;border:none;color:var(--text-dim);
  padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;
  font-family:inherit;letter-spacing:0.5px;
}
.lang-switch button.on{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.lang-switch button + button{border-left:1px solid var(--border)}
.body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 18px 8px;
  display: flex; flex-direction: column; gap: 10px;
}
.body::-webkit-scrollbar { width: 6px; }
.body::-webkit-scrollbar-track { background: transparent; }
.body::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}
.alert-row {
  display: flex; gap: 8px;
  padding: 9px 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 12.5px; line-height: 1.55;
}
.alert-row.warn {
  border-color: var(--warn-line);
  background: linear-gradient(180deg, var(--warn-soft), var(--warn-soft));
}
.alert-row.info {
  border-color: var(--accent-line);
  background: linear-gradient(180deg, var(--accent-soft), var(--accent-soft));
}
.alert-row.primary {
  border-color: var(--warn-line);
  background: linear-gradient(180deg, var(--warn-soft), var(--danger-soft));
  box-shadow: 0 0 0 1px var(--warn-line) inset, 0 0 24px var(--warn-soft);
  font-size: 13.8px;
  font-weight: 800;
}
.alert-row .dot {
  flex-shrink: 0;
  width: 6px; height: 6px;
  margin-top: 7px;
  border-radius: 50%;
  background: var(--text-dim);
}
.alert-row.warn .dot { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
.alert-row.info .dot { background: var(--accent); }
.alert-row .text { flex: 1; color: var(--text); }
.alert-row b {
  color: var(--warn-dim);
  font-weight: 700;
}
.alert-row.info b { color: var(--accent-dim); }
.alert-row code {
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 11.5px;
  padding: 1px 5px;
  background: var(--tint);
  border-radius: 3px;
  color: var(--accent-dim);
}
.alert-row a {
  color: var(--accent-dim);
  text-decoration: none;
  font-weight: 600;
}
.alert-row a:hover { text-decoration: underline; }

.section-title {
  font-size: 11.5px; font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 4px;
  padding-left: 2px;
}
.release-current, .release-history {
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  background: var(--bg-card);
}
.release-current h2 {
  margin: 0 0 12px;
  color: var(--accent-dim);
  font-size: 16px;
  font-weight: 700;
}
.release-current h3, .release-history h3 {
  font-size: 15px;
  font-weight: 600;
  margin: 12px 0 8px;
}
.release-divider {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 18px 0;
}
.release-items {
  margin: 0;
  padding-left: 20px;
  font-size: 13px;
  line-height: 1.75;
  overflow-wrap: anywhere;
}
.release-items li + li { margin-top: 8px; }
.release-items li::marker { color: var(--accent); }
.release-history { color: var(--text-dim); }
.release-history summary { cursor: pointer; font-size: 12px; font-weight: 600; }
.release-history summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
.release-history[open] .release-items { margin-top: 12px; }
.todo-list {
  display: flex; flex-direction: column; gap: 5px;
  padding: 8px 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 7px;
}
.todo-item {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 12px; color: var(--text);
  line-height: 1.45;
}
.todo-item .marker {
  flex-shrink: 0;
  width: 14px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px;
  color: var(--accent);
  margin-top: 1px;
}
.todo-item .desc { flex: 1; }
.todo-item .tag {
  flex-shrink: 0;
  font-size: 9.5px; font-weight: 700;
  padding: 1px 6px;
  margin-top: 1px;
  background: var(--accent-soft);
  color: var(--accent-dim);
  border: 1px solid var(--accent-line);
  border-radius: 8px;
  letter-spacing: 0.3px;
}
.todo-item .tag.large {
  background: var(--warn-soft);
  color: var(--warn-dim);
  border-color: var(--warn-line);
}

/* Issues / requests table — A-block. Each row has a type chip
   (bug/feature/wip/done), an optional severity chip, and a free-form
   description. Lighter background than alert-row to suggest "tracked
   item" rather than "scream warning". */
.iss-list {
  display: flex; flex-direction: column; gap: 4px;
  padding: 8px 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 7px;
}
.iss-row {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 12px; color: var(--text); line-height: 1.5;
}
.iss-row .iss-type,
.iss-row .iss-level {
  flex-shrink: 0;
  font-size: 9.5px; font-weight: 700;
  padding: 1px 7px;
  border-radius: 9px;
  letter-spacing: 0.3px;
  white-space: nowrap;
  margin-top: 2px;
}
.iss-row .iss-type.t-bug     { background: var(--danger-soft); color:var(--danger); border:1px solid var(--danger-line); }
.iss-row .iss-type.t-feature { background: var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line); }
.iss-row .iss-type.t-wip     { background: var(--warn-soft); color:var(--warn); border:1px solid var(--warn-line); }
.iss-row .iss-type.t-done    { background: var(--success-soft); color:var(--success); border:1px solid var(--success-line); }
.iss-row .iss-type.t-other   { background: var(--tint); color:var(--text-dim); border:1px solid var(--border); }
.iss-row .iss-level.l-critical { background: var(--danger-line); color:var(--danger); border:1px solid var(--danger-line); }
.iss-row .iss-level.l-high     { background: rgba(230,126,34,0.20); color:#f0a96a; border:1px solid rgba(230,126,34,0.42); }
.iss-row .iss-level.l-medium   { background: var(--warn-soft); color:var(--warn); border:1px solid var(--warn-line); }
.iss-row .iss-level.l-low      { background: var(--tint); color:var(--text-dim); border:1px solid var(--border); }
.iss-row .iss-desc { flex: 1; min-width: 0; }

/* Highlights / feature-spotlight cards — B-block. Image on the left
   (96×60 thumb), title + description on the right. The card grows in
   height to fit longer descriptions. Empty image (.no-img) collapses
   the thumb so text-only highlights still look balanced. */
.hl-list {
  display: flex; flex-direction: column; gap: 6px;
}
.hl-card {
  display: flex; gap: 10px;
  padding: 8px 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--warn);
  border-radius: 7px;
}
.hl-card.no-img { border-left-color: var(--accent); }
.hl-card .hl-img {
  flex-shrink: 0;
  width: 96px; height: 60px;
  object-fit: cover;
  border-radius: 4px;
  background: var(--bg-strong);
  border: 1px solid var(--tint);
}
.hl-card .hl-img-empty { display: none; }
.hl-card .hl-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.hl-card .hl-title { font-size: 12.5px; font-weight: 700; color: var(--warn-dim); line-height: 1.3; }
.hl-card.no-img .hl-title { color: var(--accent-dim); }
.hl-card .hl-desc { font-size: 11.5px; color: var(--text-dim); line-height: 1.5; }
.hl-card .hl-desc code {
  background: var(--tint);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0 4px;
  font-size: 10.5px;
  font-family: ui-monospace, Consolas, monospace;
}

/* Changelog list — version chip + description per row. Slightly
   tighter than the todo list so several versions fit at a glance. */
.changelog-list {
  display: flex; flex-direction: column; gap: 4px;
  padding: 8px 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 7px;
}
.cl-row {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 11.5px; color: var(--text);
  line-height: 1.5;
}
.cl-row .cl-version {
  flex-shrink: 0;
  font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
  font-size: 10.5px; font-weight: 700;
  padding: 1px 7px;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--accent-line);
  border-radius: 9px;
  letter-spacing: 0.2px;
  white-space: nowrap;
  margin-top: 1px;
}
.cl-row .cl-desc { flex: 1; }
.cl-row .cl-desc code {
  background: var(--tint);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0 4px;
  font-size: 10.5px;
  font-family: ui-monospace, Consolas, monospace;
}

.foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  padding: 10px 18px 12px;
  border-top: 1px solid var(--border);
  background: var(--bg-strong);
}
.foot .credit {
  font-size: 10.5px; color: var(--text-mute);
  font-style: italic;
}
.btn { padding: 0 18px; min-height: 32px; font-weight: 700; letter-spacing: 0.3px; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.notice-block{padding:0;border:0;background:none;line-height:1.7;font-size:13px}.notice-block h2{font-size:19px;margin-bottom:12px;color:var(--text)}.notice-block .text{color:var(--text)}.notice-block a{color:var(--accent)}.hl-card{flex-direction:column;background:none;border:0;padding:0}.hl-card .hl-img{width:100%;height:auto;max-height:none;object-fit:contain;border-radius:0}.hl-card .hl-title{color:var(--text)}.body{gap:16px}.head .title{font-size:16px}
.notice-block a{overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
/* Links outside the notice block sit on light and dark panels alike: inherit the panel text colour and rely on the underline. */
a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.announcement-important{margin:0 0 16px;padding:0 0 12px;border-bottom:1px solid var(--border);line-height:1.7}
.announcement-important>summary{color:var(--danger);font-weight:700;cursor:pointer}
.announcement-important h3,.announcement-important .step-title{margin:14px 0 6px;font-weight:700}
.announcement-important p{margin:8px 0}
.announcement-important ul{padding-left:20px}
.announcement-important img{display:block;max-width:100%;height:auto;margin:10px 0}
.announcement-important .note{margin-top:14px}
.player-permission-notice .body{min-height:0}
.player-permission-notice .announcement-important{flex-shrink:0}
.player-permission-notice .head .title{color:var(--danger);font-weight:800}
.player-permission-notice .head>div:nth-child(2){min-width:0;overflow-wrap:anywhere}
.player-permission-notice .foot{flex-wrap:wrap}
.player-permission-notice #btn-close{margin-left:auto;flex-shrink:0}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="icon"><svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></div>
    <div>
      <div class="title">Full Suite</div>
      <div class="sub">公告 / Announcement</div>
    </div>
    <div class="spacer"></div>
    <div class="lang-switch">
      <button id="ann-lang-zh" class="on" type="button">CN</button>
      <button id="ann-lang-en" type="button">EN</button>
    </div>
  </div>
  <div class="auto-progress" id="auto-progress"><div class="bar"></div></div>

  <!-- Body and credit are populated at runtime from public/announcement.md.
       The user edits that file to change the announcement; no code change
       is needed. See src/dm-announcement.ts for the parser. -->
  <div class="body" id="body">
    <div style="padding:14px 18px;color:var(--text-dim);font-size:12px;">加载公告中…</div>
  </div>

  <div class="foot">
    <div class="credit" id="credit"></div>
    <button class="btn btn-primary" id="btn-close" type="button">我知道了</button>
  </div>
</div>
<script type="module" src="/src/dm-announcement.ts"></script>
</body>
</html>
